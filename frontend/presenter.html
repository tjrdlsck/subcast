<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcast - 송출 제어기 (Presenter)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d11;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(24px);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.3);
            --accent-live: #ef4444;
            --accent-live-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --green-online: #10b981;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.7);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(79, 70, 229, 0.06) 0%, transparent 45%),
                              radial-gradient(circle at bottom left, rgba(239, 68, 68, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 헤더 스타일 고도화 */
        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            height: 56px;
            padding: 0 24px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: var(--panel-blur);
            -webkit-backdrop-filter: var(--panel-blur);
            border-bottom: 1px solid var(--panel-border);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
        }
        .header-nav-menu .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
        }
        .header-nav-menu .nav-link:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }
        .header-nav-menu .nav-link.active {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem; 
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        /* 미니 송출 미리보기 영역 */
        .mini-preview-container {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 6px 12px;
        }

        .mini-preview-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-live);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .mini-preview-label .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .preview-screen {
            width: 140px; 
            aspect-ratio: 16/9; 
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: var(--radius-sm);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        /* 퀵 컨트롤러 */
        .quick-nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-quick-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.72rem;
        }
        .btn-quick-nav:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .btn-quick-nav:active {
            transform: scale(0.95);
        }

        .slide-indicator-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 44px;
            text-align: center;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-settings-trigger {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-settings-trigger:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .status-badge {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.75rem; font-weight: 600;
            padding: 8px 14px; border-radius: var(--radius-sm);
            background: var(--panel-bg); border: 1px solid var(--panel-border);
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-live); }
        .status-badge.connected .status-dot { background-color: var(--green-online); box-shadow: 0 0 6px var(--green-online); }

        /* 메인 레이아웃 및 5x4 Grid */
        .workspace { 
            flex: 1; 
            padding: 10px 24px 24px 24px;
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .deck-title {
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            padding-bottom: 40px;
        }

        /* 슬라이드 썸네일 카드 디자인 */
        .slide-item {
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md); 
            padding: 10px; 
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; 
            user-select: none; 
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slide-item:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px); 
            box-shadow: var(--shadow-md);
        }

        /* 선택된 (Preview 대기) 슬라이드 - 초록색 하이라이트 */
        .slide-item.selected {
            border-color: var(--green-online) !important;
            background: rgba(16, 185, 129, 0.06) !important;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.35) !important;
        }
        .slide-item.selected::after {
            content: 'PREVIEW';
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--green-online);
            color: white;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }

        /* LIVE 송출 상태 슬라이드 - 빨간색 하이라이트 */
        .slide-item.live {
            border-color: var(--accent-live) !important; 
            background: rgba(239, 68, 68, 0.08) !important;
            box-shadow: 0 0 18px var(--accent-live-glow) !important;
        }
        .slide-item.live::after {
            content: ''; 
            position: absolute; 
            top: 10px; 
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-live); 
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8), 0 0 10px var(--accent-live);
            animation: live-pulse 1.5s infinite;
        }

        @keyframes live-pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8), 0 0 8px var(--accent-live);
            }
            70% {
                transform: scale(1.15);
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0), 0 0 12px var(--accent-live);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 0 8px var(--accent-live);
            }
        }

        /* 라이브 상단 헤더 배지 아이콘 */
        .live-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            transition: all 0.3s ease;
        }
        .live-status-badge .live-icon-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .live-status-badge.on {
            color: #fff;
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 12px var(--accent-live-glow);
        }
        .live-status-badge.on .live-icon-dot {
            background-color: var(--accent-live);
            box-shadow: 0 0 8px var(--accent-live);
            animation: live-pulse 1.5s infinite;
        }

        .slide-thumbnail-wrapper {
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000000; 
            border-radius: var(--radius-sm); 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .slide-thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slide-index-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-item.live .slide-index-label {
            color: var(--accent-live);
            background: rgba(239, 68, 68, 0.15);
        }

        .slide-title-label {
            font-size: 0.82rem; 
            font-weight: 600; 
            color: var(--text-main);
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            flex: 1;
            margin-left: 6px;
        }

        .slide-lock-indicator {
            display: none; 
            align-items: center; 
            gap: 4px; 
            font-size: 0.68rem;
            color: #fff;
            background: rgba(239, 68, 68, 0.85);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 15;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            max-width: calc(100% - 16px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        .slide-item.locked .slide-lock-indicator { display: flex; }

        /* 모달창 (Settings Modal) 디자인 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 8, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #121216;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            width: 460px;
            max-width: 90%;
            box-shadow: var(--shadow-lg);
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .modal-close-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-group h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-form-row {
            display: flex;
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .form-field label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .form-input {
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm); 
            padding: 10px 14px; 
            color: white;
            font-size: 0.88rem; 
            outline: none; 
            transition: all 0.2s;
            width: 100%;
        }
        .form-input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--primary-glow); 
        }

        .btn-save-settings {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-save-settings:hover {
            background: var(--primary-hover);
        }

        .bg-mode-wrapper {
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .bg-mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
            flex: 1;
        }

        .bg-mode-option input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .shortcut-info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .shortcut-key {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: monospace;
            color: #fff;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo-group">
            <h1>
                <svg style="width: 22px; height: 22px; fill: var(--primary);" viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
                </svg>
                Subcast
            </h1>
            <nav class="header-nav-menu">
                <a href="/static/index.html" class="nav-link">홈</a>
                <a href="/static/editor.html" class="nav-link">Editor</a>
                <a href="/static/presenter.html" class="nav-link active">Presenter</a>
                <a href="/static/viewer.html" target="_blank" class="nav-link">Viewer</a>
            </nav>
        </div>

        <div class="header-right-group">
            <div class="live-status-badge" id="live-status-badge" title="LIVE 송출 상태">
                <span class="live-icon-dot"></span>
                <span>LIVE</span>
            </div>
            <button class="btn-settings-trigger" id="btn-open-settings">⚙ 설정</button>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="deck-header">
            <div class="deck-title">📺 슬라이드 격자 보드</div>
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="slide-count">0 Slide</span>
        </div>
        <!-- 5열 격자 그리드 -->
        <div class="deck-grid" id="slide-list">
            <!-- 동적으로 추가됨 -->
        </div>
    </div>

    <!-- 설정 모달창 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>⚙ 송출 및 해상도 설정</h2>
                <button class="modal-close-btn" id="btn-close-settings">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 해상도 설정 -->
                <div class="settings-group">
                    <h3>OBS target 해상도 설정</h3>
                    <div class="settings-form-row">
                        <div class="form-field">
                            <label for="width-input">가로 해상도 (Width)</label>
                            <input type="number" id="width-input" class="form-input" value="1920">
                        </div>
                        <div class="form-field">
                            <label for="height-input">세로 해상도 (Height)</label>
                            <input type="number" id="height-input" class="form-input" value="1080">
                        </div>
                    </div>
                </div>

                <!-- 배경 모드 설정 -->
                <div class="settings-group">
                    <h3>Chroma Key 배경 설정</h3>
                    <div class="bg-mode-wrapper">
                        <label class="bg-mode-option">
                            <input type="radio" name="bg-mode" id="bg-transparent" value="transparent" checked>
                            <span>투명 배경 (OBS)</span>
                        </label>
                        <label class="bg-mode-option">
                            <input type="radio" name="bg-mode" id="bg-chromakey" value="chromakey">
                            <span>녹색 크로마키 (믹서)</span>
                        </label>
                    </div>
                </div>

                <!-- 단축키 정보 -->
                <div class="settings-group">
                    <h3>단축키 안내</h3>
                    <div class="shortcut-info-box">
                        • 다음 슬라이드: <span class="shortcut-key">→</span> <span class="shortcut-key">Space</span> <span class="shortcut-key">PageDown</span><br>
                        • 이전 슬라이드: <span class="shortcut-key">←</span> <span class="shortcut-key">Backspace</span> <span class="shortcut-key">PageUp</span>
                    </div>
                </div>

                <button class="btn-save-settings" id="btn-apply-res">해상도 및 설정 전송</button>
            </div>
        </div>
    </div>

    <script>
        // CanvasTextBaseline 패치: 브라우저 확장 프로그램 등에서 'alphabetical'을 넣어 발생하는 경고 우회
        (function() {
            if (typeof CanvasRenderingContext2D !== 'undefined') {
                const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
                if (descriptor && descriptor.set) {
                    const originalSet = descriptor.set;
                    Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
                        set: function(value) {
                            if (value === 'alphabetical') {
                                value = 'alphabetic';
                            }
                            originalSet.call(this, value);
                        },
                        get: descriptor.get,
                        enumerable: descriptor.enumerable,
                        configurable: descriptor.configurable
                    });
                }
            }
        })();

        let ws = null;
        let projectData = null;
        let lockedSlides = {};
        let currentLiveIndex = -1;
        let selectedSlideId = null;
        let canvas = null;
        let targetWidth = 1920;
        let targetHeight = 1080;

        // 백그라운드에서 썸네일을 자동 생성하는 함수
        function autoGenerateThumbnail(slide) {
            if (slide.thumbnail) return Promise.resolve(slide.thumbnail);
            
            return new Promise((resolve) => {
                // 1. fabric.StaticCanvas용 임시 캔버스 생성 및 요소 렌더링
                const fabricCanvasEl = document.createElement('canvas');
                fabricCanvasEl.width = 768;
                fabricCanvasEl.height = 432;
                
                const tempCanvas = new fabric.StaticCanvas(fabricCanvasEl, {
                    backgroundColor: '#000000'
                });
                
                slide.elements.forEach(elem => {
                    const obj = deserializeElement(elem, 768, 432);
                    if (obj) tempCanvas.add(obj);
                });
                
                tempCanvas.renderAll();
                
                // 2. 최종 출력용 캔버스에 검정 배경을 먼저 확실히 칠한 뒤
                //    fabric 렌더링 결과를 그 위에 합성 (fabric의 backgroundColor 미적용 버그 방지)
                const outputCanvasEl = document.createElement('canvas');
                outputCanvasEl.width = 768;
                outputCanvasEl.height = 432;
                const ctx = outputCanvasEl.getContext('2d');
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, 768, 432);
                ctx.drawImage(fabricCanvasEl, 0, 0);
                
                const dataUrl = outputCanvasEl.toDataURL('image/jpeg', 0.4);
                
                tempCanvas.dispose();
                slide.thumbnail = dataUrl;
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "SAVE_SLIDE",
                        slide: slide
                    }));
                }
                
                resolve(dataUrl);
            });
        }

        // 캔버스 초기화
        function initCanvas() {
            if (!document.getElementById('presenter-preview-canvas')) return;
            if (canvas) {
                canvas.dispose();
            }
            
            // 프리뷰는 상호작용이 없는 StaticCanvas를 사용
            canvas = new fabric.StaticCanvas('presenter-preview-canvas', {
                width: 480,
                height: 270,
                backgroundColor: '#000000'
            });
            
            updateCanvasDimensions();
        }

        // 창 크기나 프리뷰 영역 크기에 맞춰 캔버스 크기 조정
        function updateCanvasDimensions() {
            if (!canvas) return;

            const previewScreen = document.querySelector(".preview-screen");
            if (!previewScreen) return;

            const rect = previewScreen.getBoundingClientRect();
            // 종횡비 유지를 위해 width 기준으로 height 조절하거나 16:9 비율 유지
            const w = rect.width;
            const h = rect.width * (9 / 16);

            canvas.setWidth(w);
            canvas.setHeight(h);

            // 캔버스 요소를 중앙에 정렬하기 위해 컨테이너 마진 설정
            const canvasEl = canvas.getElement().parentNode;
            if (canvasEl) {
                canvasEl.style.width = `${w}px`;
                canvasEl.style.height = `${h}px`;
            }

            renderCurrentLiveSlide();
        }

        // 공용 역직렬화 (Deserialize) 함수: 백분율 데이터를 Fabric 객체로 변환
        function deserializeElement(elem, canvasWidth, canvasHeight, isInsideGroup = false, groupW = 1, groupH = 1) {
            let x, y, w, h;
            if (isInsideGroup) {
                x = (elem.x / 100) * groupW;
                y = (elem.y / 100) * groupH;
                w = (elem.width / 100) * groupW;
                h = (elem.height / 100) * groupH;
            } else {
                x = (elem.x / 100) * canvasWidth;
                y = (elem.y / 100) * canvasHeight;
                w = (elem.width / 100) * canvasWidth;
                h = (elem.height / 100) * canvasHeight;
            }
            let obj = null;
            const opacity = elem.style?.opacity !== undefined ? elem.style.opacity : 1.0;
            if (elem.type === 'text') {
                let fontSize = 20;
                if (elem.style?.fontSize) {
                    const match = elem.style.fontSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                    fontSize = match ? (parseFloat(match[1]) / 100) * (isInsideGroup ? groupW : canvasWidth) : parseInt(elem.style.fontSize) || 20;
                }
                // Textbox를 사용하여 w 너비 기준 자동 줄바꿈(Word Wrap) 지원
                const textOptions = {
                    left: x,
                    top: y,
                    width: w > 50 ? w : 250,
                    fontSize: fontSize,
                    fill: elem.style?.fontColor || '#ffffff',
                    stroke: elem.style?.strokeColor || 'transparent',
                    strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0,
                    fontFamily: elem.style?.fontFamily || 'Inter',
                    fontWeight: elem.style?.fontWeight || 'normal',
                    fontStyle: elem.style?.fontStyle || 'normal',
                    textAlign: elem.style?.textAlign || 'left',
                    opacity: opacity,
                    selectable: false,
                    paintFirst: 'stroke'
                };
                obj = isInsideGroup ? 
                    new fabric.Text(elem.content, textOptions) : 
                    new fabric.Textbox(elem.content, Object.assign(textOptions, { splitByGrapheme: false }));
            } else if (elem.type === 'rect') {
                obj = new fabric.Rect({ left: x, top: y, width: w, height: h, rx: elem.style?.cornerRadius || 0, ry: elem.style?.cornerRadius || 0, fill: elem.style?.fillColor || '#4f46e5', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? (elem.style.strokeWidth / 1920) * canvasWidth : 0, opacity: opacity, selectable: false });
            } else if (elem.type === 'circle') {
                obj = new fabric.Circle({ left: x, top: y, radius: w / 2 || 30, fill: elem.style?.fillColor || '#06b6d4', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? (elem.style.strokeWidth / 1920) * canvasWidth : 0, opacity: opacity, selectable: false });
            } else if (elem.type === 'triangle') {
                obj = new fabric.Triangle({ left: x, top: y, width: w, height: h, fill: elem.style?.fillColor || '#10b981', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? (elem.style.strokeWidth / 1920) * canvasWidth : 0, opacity: opacity, selectable: false });
            } else if (elem.type === 'line') {
                obj = new fabric.Line([x, y, x + w, y], { stroke: elem.style?.fillColor || elem.style?.strokeColor || '#f59e0b', strokeWidth: elem.style?.strokeWidth !== undefined && elem.style?.strokeWidth > 0 ? (elem.style.strokeWidth / 1920) * canvasWidth : 4, opacity: opacity, selectable: false });
            } else if (elem.type === 'group' && elem.children) {
                const members = elem.children.map(child => deserializeElement(child, canvasWidth, canvasHeight, true, w, h));
                obj = new fabric.Group(members, { left: x, top: y, opacity: opacity, selectable: false });
            }
            return obj;
        }

        // 현재 라이브 슬라이드 그리기
        function renderCurrentLiveSlide() {
            if (!canvas || !projectData) return;

            canvas.clear();

            const currentLiveSlideId = projectData.settings?.currentLiveSlideId;
            if (!currentLiveSlideId) return;

            const currentSlide = projectData.slides.find(s => s.id === currentLiveSlideId);
            if (!currentSlide) return;

            // 절대 해상도(targetWidth, targetHeight)를 기준으로 렌더링하고 setZoom으로 배율을 맞춥니다.
            const scale = canvas.getWidth() / targetWidth;
            canvas.setZoom(scale);

            currentSlide.elements.forEach(elem => {
                const obj = deserializeElement(elem, targetWidth, targetHeight);
                if (obj) {
                    canvas.add(obj);
                }
            });

            canvas.renderAll();
        }

        // UI 갱신
        function renderDeck() {
            const listEl = document.getElementById("slide-list");
            listEl.innerHTML = "";

            if (!projectData || !projectData.slides) return;

            document.getElementById("slide-count").innerText = `${projectData.slides.length} Slides`;

            // 상단 LIVE 배지 아이콘 상태 및 클릭 이벤트 업데이트
            const liveBadge = document.getElementById("live-status-badge");
            const hasLiveSlide = !!projectData.settings?.currentLiveSlideId;
            if (liveBadge) {
                liveBadge.style.cursor = "pointer";
                if (hasLiveSlide) {
                    liveBadge.classList.add("on");
                } else {
                    liveBadge.classList.remove("on");
                }
                liveBadge.onclick = () => {
                    if (hasLiveSlide) {
                        // 송출 중일 때는 송출 끄기 (OFF)
                        changeSlide(null);
                    } else {
                        // 송출 OFF일 때는 현재 선택된(초록색) 슬라이드를 송출 (LIVE ON)
                        if (selectedSlideId) {
                            changeSlide(selectedSlideId);
                        } else if (projectData.slides.length > 0) {
                            changeSlide(projectData.slides[0].id);
                        }
                    }
                };
            }

            projectData.slides.forEach((slide, index) => {
                const item = document.createElement("div");
                item.className = "slide-item";
                item.id = `slide-item-${slide.id}`;
                
                const isLive = slide.id === projectData.settings?.currentLiveSlideId;
                const isSelected = slide.id === selectedSlideId;

                if (isLive) {
                    item.classList.add("live");
                    currentLiveIndex = index;
                } else if (isSelected) {
                    item.classList.add("selected");
                }

                const isLocked = lockedSlides[slide.id] !== undefined;
                if (isLocked) {
                    item.classList.add("locked");
                }

                // 배지 색상 구분: LIVE면 빨간색, Selected(대기)면 초록색, 기본 보라색
                let badgeBg = "var(--primary)";
                let badgeShadow = "0 2px 5px rgba(0,0,0,0.5)";
                if (isLive) {
                    badgeBg = "var(--accent-live)";
                    badgeShadow = "0 0 8px var(--accent-live-glow)";
                } else if (isSelected) {
                    badgeBg = "var(--green-online)";
                    badgeShadow = "0 0 8px rgba(16, 185, 129, 0.5)";
                }

                item.innerHTML = `
                    <!-- 슬라이드 순번 배지 -->
                    <div style="position: absolute; top: -8px; left: -8px; background: ${badgeBg}; color: #fff; font-size: 0.7rem; font-weight: 800; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--bg-color); z-index: 20; font-family: 'Outfit', sans-serif; box-shadow: ${badgeShadow};">
                        ${index + 1}
                    </div>
                    <div class="slide-thumbnail-wrapper">
                        ${slide.thumbnail ? `<img src="${slide.thumbnail}">` : `<span style="font-size: 0.72rem; color: var(--text-muted);">미리보기 없음</span>`}
                    </div>
                    ${isLocked ? `<div class="slide-lock-indicator">🔒 ${lockedSlides[slide.id] || ''} 편집 중</div>` : ''}
                `;

                // 클릭 시 슬라이드 대기(Preview: 초록색) 선택
                item.onclick = () => {
                    selectedSlideId = slide.id;
                    renderDeck();
                };

                listEl.appendChild(item);
            });

            // 상단 퀵 네비게이션 인디케이터 업데이트
            const indicatorEl = document.getElementById("slide-indicator");
            if (indicatorEl) {
                indicatorEl.innerText = `${currentLiveIndex !== -1 ? String(currentLiveIndex + 1).padStart(2, '0') : '00'} / ${String(projectData.slides.length).padStart(2, '0')}`;
            }

            // 피어 스크롤 동기화 (활성 슬라이드로 자동 스크롤)
            const activeItem = document.querySelector(".slide-item.live");
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 라이브 프리뷰 업데이트
            renderCurrentLiveSlide();
        }

        // 슬라이드 전환 명령 송신
        function changeSlide(slideId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({
                type: "SLIDE_CHANGE",
                slideId: slideId
            }));
        }

        // 이전/다음 슬라이드 전환
        function navigateSlide(direction) {
            if (!projectData || !projectData.slides) return;
            const len = projectData.slides.length;
            if (len === 0) return;

            let nextIdx = currentLiveIndex;
            if (direction === 'next') {
                nextIdx = (currentLiveIndex + 1) % len;
            } else if (direction === 'prev') {
                nextIdx = (currentLiveIndex - 1 + len) % len;
            }

            changeSlide(projectData.slides[nextIdx].id);
        }

        // 웹소켓 연결
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=presenter`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.add("connected");
                document.getElementById("status-text").innerText = "Connected";
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'INITIAL_SYNC') {
                    projectData = message.data;
                    lockedSlides = message.lockedSlides || {};
                    
                    if (projectData.settings) {
                        document.getElementById("width-input").value = projectData.settings.targetWidth || 1920;
                        document.getElementById("height-input").value = projectData.settings.targetHeight || 1080;
                        targetWidth = projectData.settings.targetWidth || 1920;
                        targetHeight = projectData.settings.targetHeight || 1080;
                        
                        const bgMode = projectData.settings.backgroundMode || "transparent";
                        const radioEl = document.getElementById(`bg-${bgMode}`);
                        if (radioEl) radioEl.checked = true;
                    }
                    initCanvas();
                    renderDeck();

                    // 썸네일이 없는 슬라이드가 있다면 순차적으로 자동 생성하여 반영 및 서버 동기화
                    let needsUpdate = false;
                    const promises = projectData.slides.map(slide => {
                        if (!slide.thumbnail) {
                            needsUpdate = true;
                            return autoGenerateThumbnail(slide);
                        }
                        return Promise.resolve();
                    });
                    
                    if (needsUpdate) {
                        Promise.all(promises).then(() => {
                            renderDeck();
                        });
                    }
                }
                else if (message.type === 'SET_BACKGROUND_MODE') {
                    if (projectData && projectData.settings) {
                        projectData.settings.backgroundMode = message.mode;
                    }
                    const radioEl = document.getElementById(`bg-${message.mode}`);
                    if (radioEl) radioEl.checked = true;
                }
                else if (message.type === 'SLIDE_CHANGE') {
                    if (projectData) {
                        projectData.settings.currentLiveSlideId = message.slideId;
                        if (message.slideId) {
                            selectedSlideId = message.slideId;
                        }
                        renderDeck();
                    }
                }
                else if (message.type === 'UPDATE_RESOLUTION') {
                    document.getElementById("width-input").value = message.width;
                    document.getElementById("height-input").value = message.height;
                    targetWidth = message.width;
                    targetHeight = message.height;
                    updateCanvasDimensions();
                }
                else if (message.type === 'SLIDE_LOCKED') {
                    lockedSlides[message.slideId] = message.editorName;
                    renderDeck();
                }
                else if (message.type === 'SLIDE_UNLOCKED') {
                    delete lockedSlides[message.slideId];
                    renderDeck();
                }
                else if (message.type === 'SLIDE_UPDATED') {
                    // 슬라이드 데이터 변경 감지 (Presenter 화면에서도 미리보기 조용히 갱신)
                    if (projectData) {
                        const idx = projectData.slides.findIndex(s => s.id === message.slideId);
                        if (idx !== -1) {
                            projectData.slides[idx] = message.slide;
                        } else {
                            projectData.slides.push(message.slide);
                        }
                        renderDeck();
                    }
                }
            };

            ws.onclose = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.remove("connected");
                document.getElementById("status-text").innerText = "Disconnected";
                setTimeout(connectWebSocket, 3000);
            };
        }

        window.onload = () => {
            connectWebSocket();

            // 설정 모달 제어 이벤트 바인딩
            const modal = document.getElementById("settings-modal");
            const openBtn = document.getElementById("btn-open-settings");
            const closeBtn = document.getElementById("btn-close-settings");

            if (openBtn && modal) {
                openBtn.onclick = () => modal.classList.add("active");
            }
            if (closeBtn && modal) {
                closeBtn.onclick = () => modal.classList.remove("active");
            }
            if (modal) {
                modal.onclick = (e) => {
                    if (e.target === modal) {
                        modal.classList.remove("active");
                    }
                };
            }

            // 이전/다음 버튼 리스너
            const btnPrev = document.getElementById("btn-prev");
            if (btnPrev) btnPrev.onclick = () => navigateSlide('prev');
            const btnNext = document.getElementById("btn-next");
            if (btnNext) btnNext.onclick = () => navigateSlide('next');

            // 해상도 및 배경 모드 전송 버튼 리스너
            document.getElementById("btn-apply-res").onclick = () => {
                const w = parseInt(document.getElementById("width-input").value) || 1920;
                const h = parseInt(document.getElementById("height-input").value) || 1080;
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    // 1. 해상도 설정 전송
                    ws.send(JSON.stringify({
                        type: "UPDATE_RESOLUTION",
                        width: w,
                        height: h
                    }));

                    // 2. 크로마키 배경 설정 전송
                    const checkedRadio = document.querySelector('input[name="bg-mode"]:checked');
                    if (checkedRadio) {
                        ws.send(JSON.stringify({
                            type: "SET_BACKGROUND_MODE",
                            mode: checkedRadio.value
                        }));
                    }
                }
                if (modal) {
                    modal.classList.remove("active");
                }
            };

            // 키보드 단축키
            window.onkeydown = (e) => {
                const activeEl = document.activeElement;
                if (activeEl && activeEl.tagName === 'INPUT') return; // 입력 필드 조작 중인 경우 무시

                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                    e.preventDefault();
                    navigateSlide('next');
                } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
                    e.preventDefault();
                    navigateSlide('prev');
                }
            };

            // 리사이즈 이벤트 연결
            window.addEventListener('resize', updateCanvasDimensions);
        };
    </script>
</body>
</html>
