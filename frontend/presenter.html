<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcast - 송출 제어기 (Presenter)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/presenter.css">
</head>

<body>
    <header>
        <div class="header-logo-group">
            <h1>
                <svg style="width: 22px; height: 22px; fill: var(--primary);" viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z" />
                </svg>
                Subcast
            </h1>
            <nav class="header-nav-menu">
                <a href="/static/index.html" class="nav-link">Home</a>
                <a href="/static/editor.html" class="nav-link">Editor</a>
                <a href="/static/presenter.html" class="nav-link active">Presenter</a>
                <a href="/static/viewer.html?channel=obs" target="_blank" class="nav-link" title="OBS 방송용 (투명 자막)">Viewer (OBS)</a>
                <a href="/static/viewer.html?channel=stage" target="_blank" class="nav-link" title="현장 모니터용 (자막+움직이는 배경)">Viewer (Stage)</a>
            </nav>
        </div>

        <div class="header-right-group">
            <div class="live-status-badge" id="live-status-badge" title="LIVE 송출 상태">
                <span class="live-icon-dot"></span>
                <span>LIVE</span>
            </div>
            <button class="btn-settings-trigger" id="btn-open-settings">⚙ 설정</button>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="deck-header">
            <div class="deck-title">슬라이드 격자 보드</div>
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="slide-count">0 Slide</span>
        </div>
        <!-- 5열 격자 그리드 -->
        <div class="deck-grid" id="slide-list">
            <!-- 동적으로 추가됨 -->
        </div>
    </div>

    <!-- 설정 모달창 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>⚙ 송출 및 해상도 설정</h2>
                <button class="modal-close-btn" id="btn-close-settings">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 해상도 설정 -->
                <div class="settings-group">
                    <h3>OBS 자막 target 해상도 설정</h3>
                    <div class="settings-form-row">
                        <div class="form-field">
                            <label for="width-input">가로 해상도 (Width)</label>
                            <input type="number" id="width-input" class="form-input" value="1920">
                        </div>
                        <div class="form-field">
                            <label for="height-input">세로 해상도 (Height)</label>
                            <input type="number" id="height-input" class="form-input" value="1080">
                        </div>
                    </div>
                </div>

                <!-- 현장 모니터 해상도 설정 -->
                <div class="settings-group">
                    <h3>📺 현장 모니터 (Stage View) target 해상도 설정</h3>
                    <div class="settings-form-row">
                        <div class="form-field">
                            <label for="stage-width-input">가로 해상도 (Width)</label>
                            <input type="number" id="stage-width-input" class="form-input" value="1920">
                        </div>
                        <div class="form-field">
                            <label for="stage-height-input">세로 해상도 (Height)</label>
                            <input type="number" id="stage-height-input" class="form-input" value="1080">
                        </div>
                    </div>
                </div>

                <!-- 배경 모드 설정 -->
                <div class="settings-group">
                    <h3>배경 설정</h3>
                    <div class="bg-mode-wrapper">
                        <label class="bg-mode-option">
                            <input type="radio" name="bg-mode" id="bg-transparent" value="transparent" checked>
                            <span>투명 배경 (OBS)</span>
                        </label>
                    </div>
                </div>

                <!-- 단축키 정보 -->
                <div class="settings-group">
                    <h3>단축키 안내</h3>
                    <div class="shortcut-info-box">
                        • 다음 슬라이드: <span class="shortcut-key">→</span> <span class="shortcut-key">Space</span> <span
                            class="shortcut-key">PageDown</span><br>
                        • 이전 슬라이드: <span class="shortcut-key">←</span> <span class="shortcut-key">Backspace</span> <span
                            class="shortcut-key">PageUp</span>
                    </div>
                </div>

                <button class="btn-save-settings" id="btn-apply-res">해상도 및 설정 전송</button>
            </div>
        </div>
    </div>

    <script src="js/presenter.js"></script>
</body>

</html>
