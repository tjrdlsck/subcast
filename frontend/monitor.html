<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcast Stage Confidence Monitor</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <link rel="stylesheet" href="/static/css/viewer.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="system-disconnected">
    <div class="disconnect-banner" id="banner">연결 두절 - 모니터링 오버레이 숨김</div>

    <div id="monitor-viewer-container" style="display: block; position: absolute; top:0; left:0; width:100vw; height:100vh; background:#0f172a; overflow:hidden; pointer-events:none; z-index: 100;">
        <div id="monitor-current-card" class="monitor-card current-card" style="position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; transition: all 0.1s ease-out; overflow: hidden; background: rgba(15, 23, 42, 0.95); border: 2px solid #ef4444; border-radius: 12px; box-shadow: 0 8px 24px rgba(239, 68, 68, 0.2);">
            <div class="monitor-card-header" style="position: absolute; top: 12px; left: 18px; font-size: 0.85rem; font-weight: 700; color: #ef4444; text-transform: uppercase; letter-spacing: 1px;">🔴 CURRENT</div>
            <div id="monitor-current-text" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; white-space: pre-wrap; word-break: break-word; line-height: 1.35; font-weight: 600;"></div>
        </div>
        <div id="monitor-next-card" class="monitor-card next-card" style="position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; transition: all 0.1s ease-out; overflow: hidden; background: rgba(15, 23, 42, 0.85); border: 2px solid #3b82f6; border-radius: 12px; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);">
            <div class="monitor-card-header" style="position: absolute; top: 12px; left: 18px; font-size: 0.85rem; font-weight: 700; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px;">🔵 NEXT</div>
            <div id="monitor-next-text" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: #a0a0a0; white-space: pre-wrap; word-break: break-word; line-height: 1.35; font-weight: 500;"></div>
        </div>
    </div>

    <div id="canvas-container" style="display: none;">
        <canvas id="viewer-canvas"></canvas>
    </div>

    <script>
        // URL에 channel=monitor를 자동으로 전달하여 viewer.js가 모니터링 뷰로 동작하게 설정
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('channel')) {
            urlParams.set('channel', 'monitor');
            window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }
    </script>
    <script src="js/viewer.js"></script>
</body>
</html>
