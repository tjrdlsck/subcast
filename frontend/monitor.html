<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcast Stage Confidence Monitor</title>
    <link rel="icon" href="data:,">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <link rel="stylesheet" href="/static/css/viewer.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="system-disconnected monitor-mode">
    <div class="disconnect-banner" id="banner">연결 두절 - 모니터링 오버레이 숨김</div>

    <div id="monitor-viewer-container" style="display: block; position: absolute; top:0; left:0; width:100vw; height:100vh; background:#000000; overflow:hidden; pointer-events:none; z-index: 1000;">
        <div id="monitor-current-card" class="monitor-card current-card" style="position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0; box-sizing: border-box; transition: all 0.1s ease-out; overflow: hidden; background: transparent; border: none; box-shadow: none;">
            <div id="monitor-current-text" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; white-space: pre-wrap; word-break: break-word; line-height: 1.35; font-weight: 700;"></div>
        </div>
        <div id="monitor-next-card" class="monitor-card next-card" style="position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0; box-sizing: border-box; transition: all 0.1s ease-out; overflow: hidden; background: transparent; border: none; box-shadow: none;">
            <div id="monitor-next-text" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: #a0a0a0; white-space: pre-wrap; word-break: break-word; line-height: 1.35; font-weight: 600;"></div>
        </div>
    </div>

    <div id="canvas-container" style="display: none;">
        <canvas id="viewer-canvas"></canvas>
    </div>

    <script>
        // URL에 channel=monitor를 자동으로 전달하여 viewer.js가 모니터링 뷰로 동작하게 설정
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('channel')) {
            urlParams.set('channel', 'monitor');
            window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }
    </script>
    <script src="/static/js/viewer.js"></script>
    <script>
        // 자동 전체화면 (Auto Fullscreen) & 1클릭 승격 로직
        const shouldAutoFullscreen = urlParams.get('autofullscreen') === 'true';

        function tryEnterFullscreen() {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => {
                    console.log('[Monitor] 전체화면 진입 성공');
                }).catch(err => {
                    console.log('[Monitor] 브라우저 보안으로 인한 자동 전체화면 대기 (클릭 필요):', err);
                });
            }
        }

        if (shouldAutoFullscreen) {
            window.addEventListener('load', () => {
                setTimeout(tryEnterFullscreen, 50);
            });

            const handleInteract = (e) => {
                tryEnterFullscreen();
            };

            window.addEventListener('pointerdown', handleInteract, { capture: true });
            window.addEventListener('click', handleInteract, { capture: true });
            window.addEventListener('keydown', handleInteract, { capture: true });
        }

        // F키 입력 시 전체화면 토글
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    tryEnterFullscreen();
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
