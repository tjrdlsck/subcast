<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcast - 프로젝트 관리 시스템</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- Top Fixed Header -->
    <header class="top-nav-bar">
        <div class="header-logo-group">
            <h1>
                <svg style="width: 22px; height: 22px; fill: var(--primary);" viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
                </svg>
                Subcast
            </h1>
            <nav class="header-nav-menu">
                <a href="/static/index.html" class="nav-link active">Home</a>
                <a href="/static/editor.html" class="nav-link">Editor</a>
                <a href="/static/presenter.html" class="nav-link">Presenter</a>
                <a href="/static/viewer.html?channel=obs" target="_blank" class="nav-link" title="OBS 방송용 (투명 자막)">Viewer (OBS)</a>
                <a href="/static/viewer.html?channel=stage" target="_blank" class="nav-link" title="현장 모니터용 (자막+움직이는 배경)">Viewer (Stage)</a>
                <a href="/static/monitor.html" target="_blank" class="nav-link" title="무대 프롬프터/자막 모니터 화면">Stage Monitor</a>
                <button type="button" class="nav-link btn-multi-cast" id="btn-multi-display-cast" onclick="window.openDisplayModal && window.openDisplayModal()" title="연결된 다중 모니터에 창을 자동으로 분할 송출합니다.">멀티 송출</button>
            </nav>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span id="app-version-badge" style="font-size: 0.8rem; background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); padding: 3px 10px; border-radius: 12px; font-weight: 600;">v1.3.15</span>
            <button id="btn-check-update" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #d1d5db; padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                업데이트 확인
            </button>
        </div>
    </header>

    <div class="container">
        <section class="hero-section">
            <h2>Subcast System</h2>
            <p>다중 프로젝트 기록 및 실시간 자막 방송 관리를 지원하는 통합 시스템</p>
        </section>

        <!-- 프로젝트 관리 섹션 -->
        <section class="projects-section">
            <div class="projects-header">
                <div class="projects-title">
                    <span>📂 프로젝트 목록</span>
                    <span class="projects-count-badge" id="projects-count">0개</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" id="file-import-project" accept=".json" style="display: none;" />
                    <button class="btn-create-project" id="btn-import-project-trigger" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); padding: 10px 14px;" title="프로젝트 가져오기">
                        <img src="/static/assets/icons/download.svg" style="width: 16px; height: 16px; filter: brightness(0) invert(1);" alt="가져오기" />
                    </button>
                    <button class="btn-create-project" id="btn-open-create-modal">
                        <span>+ 새 프로젝트 추가</span>
                    </button>
                </div>
            </div>

            <!-- 프로젝트 검색창 -->
            <div class="project-search-box">
                <span class="project-search-icon">🔍</span>
                <input type="text" id="project-search-input" class="project-search-input" placeholder="프로젝트 이름으로 검색..." />
            </div>

            <!-- 단축키 안내 툴바 -->
            <div class="toolbar-info-bar">
                <div class="shortcut-tips">
                    <span>💡 단축키: <kbd>Ctrl</kbd>/<kbd>Shift</kbd> + 클릭 (다중 선택) | <kbd>Ctrl+C</kbd> (복사) | <kbd>Ctrl+V</kbd> (붙여넣기) | <kbd>Del</kbd> (삭제)</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button id="btn-export-selected" class="action-btn btn-export" style="display: none; padding: 6px 10px;" title="선택한 프로젝트 내보내기">
                        <img src="/static/assets/icons/upload.svg" style="width: 14px; height: 14px; filter: brightness(0) invert(1);" alt="선택 내보내기" />
                    </button>
                    <span class="selected-count-badge" id="selected-count-badge">0개 선택됨</span>
                </div>
            </div>

            <!-- 프로젝트 리스트 영역 -->
            <div class="project-list" id="project-list-container">
                <!-- Javascript 동적 로딩 -->
            </div>
        </section>

        <footer>
            <p>© 2026 Subcast. All rights reserved.</p>
        </footer>
    </div>

    <!-- 프로젝트 생성 모달 -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-box">
            <div class="modal-header">새 프로젝트 추가</div>
            <div class="form-group">
                <label for="new-project-name">프로젝트 이름</label>
                <input type="text" id="new-project-name" class="form-input" placeholder="예: 주일 예배 자막 프로젝트" autofocus>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btn-close-modal">취소</button>
                <button class="btn-submit" id="btn-submit-create">생성하기</button>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 메시지 -->
    <div class="toast-notification" id="toast"></div>

    <script src="js/modules/editor-display-manager.js?v=1.0.3"></script>
    <script src="js/index.js"></script>
</body>
</html>
