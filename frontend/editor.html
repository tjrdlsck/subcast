<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Subcast - 실시간 편집기 (Editor)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.3);
            --secondary: #06b6d4;
            --secondary-glow: rgba(6, 182, 212, 0.3);
            --accent-live: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --green-online: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .editor-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-name-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .editor-name-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 120px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-live);
        }

        .status-badge.connected .status-dot {
            background-color: var(--green-online);
            box-shadow: 0 0 10px var(--green-online);
        }

        /* 메인 레이아웃 */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 80px);
        }

        /* 왼쪽: 슬라이드 목록 */
        .slide-panel {
            border-right: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .slide-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .slide-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .slide-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .slide-item.editing {
            border-color: var(--secondary);
            background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 15px var(--secondary-glow);
        }

        .slide-item.editing::before {
            content: 'EDITING';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--secondary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-item.locked {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .slide-item.locked::before {
            content: 'LOCKED';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-live);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-item h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 70px;
        }

        .slide-preview-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lock-owner-text {
            font-size: 0.75rem;
            color: #fb7185;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 오른쪽: 편집기 캔버스 영역 */
        .editor-container {
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 20px;
            overflow-y: auto;
            align-items: center;
        }

        .editor-workspace {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 컨트롤 영역 */
        .editor-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .tool-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-tool:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-save {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-save:hover:not(:disabled) {
            background: #4338ca;
        }

        .btn-cancel {
            background: transparent;
            border-color: transparent;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .text-input-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            width: 300px;
            transition: border-color 0.2s ease;
        }

        .text-input-field:focus {
            border-color: var(--secondary);
        }

        .fontSize-input {
            width: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            text-align: center;
        }

        .fontColor-input {
            width: 50px;
            height: 40px;
            border: 1px solid var(--panel-border);
            background: none;
            cursor: pointer;
            border-radius: 8px;
        }

        /* 잠금 알림 안내 배너 */
        .lock-warning-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            display: none;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Subcast Editor</h1>
        <div class="header-controls">
            <div class="editor-name-group">
                <label for="editor-name">내 이름</label>
                <input type="text" id="editor-name" class="editor-name-input" value="편집자A">
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <!-- 왼쪽: 슬라이드 목록 -->
        <div class="slide-panel">
            <div class="panel-header">슬라이드 리스트</div>
            <div class="slide-list" id="slide-list">
                <!-- 동적 렌더링 -->
            </div>
        </div>

        <!-- 오른쪽: 편집기 캔버스 영역 -->
        <div class="editor-container">
            <div class="editor-workspace">
                <!-- 편집 잠금 상태 알림 배너 -->
                <div class="lock-warning-banner" id="lock-banner">
                    ⚠️ 다른 사용자가 편집 중인 슬라이드입니다.
                </div>

                <div class="editor-card">
                    <h3 style="font-family: 'Outfit'; font-size: 1.2rem; font-weight: 600;" id="editor-title">슬라이드를 선택해주세요.</h3>
                    
                    <div class="canvas-wrapper">
                        <canvas id="editor-canvas"></canvas>
                    </div>

                    <!-- 편집 도구 모음 -->
                    <div class="editor-controls">
                        <!-- 텍스트 설정 그룹 -->
                        <div class="tool-group">
                            <input type="text" id="text-editor" class="text-input-field" placeholder="자막 내용 입력" disabled>
                            <input type="number" id="fontsize-editor" class="fontSize-input" value="3" min="1" max="10" step="0.5" disabled>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">vw</span>
                            <input type="color" id="fontcolor-editor" class="fontColor-input" value="#ffffff" disabled>
                        </div>

                        <!-- 액션 저장/취소 그룹 -->
                        <div class="tool-group">
                            <button class="btn-tool btn-cancel" id="btn-cancel" disabled>취소</button>
                            <button class="btn-tool btn-save" id="btn-save" disabled>저장 (Apply)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let projectData = null;
        let lockedSlides = {};
        let activeSlideId = null;
        let canvas = null;
        let myEditorId = null; // 웹소켓 세션 ID를 식별하기 위해 수신
        let currentEditingElement = null; // 현재 로컬 편집 중인 요소 레퍼런스

        // 캔버스 초기화
        function initCanvas() {
            canvas = new fabric.Canvas('editor-canvas', {
                width: 768, // 가로 해상도 기본 스케일 설정
                height: 432, // 세로 해상도 (16:9 비율 유지)
                backgroundColor: '#111827'
            });

            // 요소 클릭/선택 시 입력 필드 동기화
            canvas.on('selection:created', onObjectSelected);
            canvas.on('selection:updated', onObjectSelected);
            canvas.on('selection:cleared', onObjectCleared);

            // 로컬 드래그 시 좌표 정보 갱신 (로컬 메모리에만 격리 유지)
            canvas.on('object:moving', onObjectModified);
            canvas.on('object:scaling', onObjectModified);
        }

        // 사용자 닉네임 기본 세팅
        document.getElementById("editor-name").value = `편집자_${Math.floor(Math.random() * 900) + 100}`;

        // 슬라이드 목록 렌더링
        function renderSlides() {
            const listEl = document.getElementById("slide-list");
            listEl.innerHTML = "";

            if (!projectData || !projectData.slides) return;

            projectData.slides.forEach((slide, index) => {
                const item = document.createElement("div");
                item.className = "slide-item";
                item.id = `slide-item-${slide.id}`;

                // 현재 선택해서 편집 중인 슬라이드 표시
                if (slide.id === activeSlideId) {
                    item.classList.add("editing");
                }

                // 다른 사용자가 락을 쥐고 있는지 여부 체크
                const lockOwner = lockedSlides[slide.id];
                const isLockedByOthers = lockOwner !== undefined && lockOwner.ownerId !== myEditorId;
                if (isLockedByOthers) {
                    item.classList.add("locked");
                }

                const textElem = slide.elements.find(e => e.type === 'text');
                const contentText = textElem ? textElem.content : "(요소 없음)";

                item.innerHTML = `
                    <h3>${index + 1}. ${slide.name}</h3>
                    <div class="slide-preview-text">${contentText}</div>
                    ${isLockedByOthers ? `<div class="lock-owner-text">🔒 ${lockOwner.editorName}님이 편집 중</div>` : ''}
                `;

                // 클릭 리스너 (락이 걸리지 않았을 때만 작동)
                if (!isLockedByOthers) {
                    item.onclick = () => selectSlideForEdit(slide.id);
                }

                listEl.appendChild(item);
            });
        }

        // 특정 슬라이드 편집을 위해 선택
        function selectSlideForEdit(slideId) {
            if (activeSlideId === slideId) return;

            // 이미 다른 슬라이드를 편집 중이었다면 언락 메시지 전송
            if (activeSlideId) {
                releaseActiveLock();
            }

            activeSlideId = slideId;
            document.getElementById("editor-title").innerText = `슬라이드 편집: ${projectData.slides.find(s => s.id === slideId).name}`;

            // 서버에 락 요청
            const editorName = document.getElementById("editor-name").value;
            ws.send(JSON.stringify({
                type: "LOCK_SLIDE",
                slideId: slideId,
                editorName: editorName
            }));

            // 로컬 캔버스 로드 및 컨트롤 활성화
            loadSlideToCanvas(slideId);
            setControlsState(true);
            renderSlides();
        }

        // 활성 슬라이드 락 릴리즈
        function releaseActiveLock() {
            if (ws && ws.readyState === WebSocket.OPEN && activeSlideId) {
                ws.send(JSON.stringify({
                    type: "UNLOCK_SLIDE",
                    slideId: activeSlideId
                }));
            }
        }

        // 캔버스에 슬라이드 데이터 로딩
        function loadSlideToCanvas(slideId) {
            canvas.clear();
            const slide = projectData.slides.find(s => s.id === slideId);
            if (!slide) return;

            const canvasWidth = canvas.getWidth();
            const canvasHeight = canvas.getHeight();

            slide.elements.forEach(elem => {
                const x = (elem.x / 100) * canvasWidth;
                const y = (elem.y / 100) * canvasHeight;
                const w = (elem.width / 100) * canvasWidth;
                const h = (elem.height / 100) * canvasHeight;

                if (elem.type === 'text') {
                    // vw -> px 변환
                    let fontSize = 20;
                    if (elem.style?.fontSize) {
                        const match = elem.style.fontSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                        if (match) {
                            fontSize = (parseFloat(match[1]) / 100) * canvasWidth;
                        } else {
                            fontSize = parseInt(elem.style.fontSize) || 20;
                        }
                    }

                    const textObj = new fabric.Text(elem.content, {
                        left: x,
                        top: y,
                        width: w,
                        height: h,
                        fontSize: fontSize,
                        fill: elem.style?.fontColor || '#ffffff',
                        fontFamily: 'Inter',
                        selectable: true,
                        hasControls: true,
                        // 오리지널 데이터 캐싱용 커스텀 속성
                        originalId: elem.id,
                        originalVwSize: elem.style?.fontSize || "3vw"
                    });

                    canvas.add(textObj);
                }
            });
            canvas.renderAll();
        }

        // 입력 폼 활성화/비활성화 제어
        function setControlsState(enabled) {
            document.getElementById("text-editor").disabled = !enabled;
            document.getElementById("fontsize-editor").disabled = !enabled;
            document.getElementById("fontcolor-editor").disabled = !enabled;
            document.getElementById("btn-save").disabled = !enabled;
            document.getElementById("btn-cancel").disabled = !enabled;
        }

        // 오브젝트 선택 시 이벤트
        function onObjectSelected(e) {
            const activeObj = e.selected[0];
            if (!activeObj || activeObj.type !== 'text') return;

            currentEditingElement = activeObj;

            // 텍스트 인풋 필드 갱신
            document.getElementById("text-editor").value = activeObj.text;
            
            // vw 값 계산
            let vwVal = 3.0;
            if (activeObj.originalVwSize) {
                const match = activeObj.originalVwSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                if (match) {
                    vwVal = parseFloat(match[1]);
                }
            }
            document.getElementById("fontsize-editor").value = vwVal;
            document.getElementById("fontcolor-editor").value = activeObj.fill;
        }

        function onObjectCleared() {
            currentEditingElement = null;
            document.getElementById("text-editor").value = "";
        }

        // 로컬 캔버스 이동/스케일 시 데이터 업데이트 (메모리 격리)
        function onObjectModified(e) {
            const activeObj = e.target;
            if (!activeObj) return;

            // 사이즈나 크기 수정 시 vw 값을 실시간 재계산해서 저장할 수 있도록 캐싱
            const canvasWidth = canvas.getWidth();
            const currentFontSize = activeObj.fontSize * (activeObj.scaleX || 1);
            const newVwSize = `${((currentFontSize / canvasWidth) * 100).toFixed(2)}vw`;
            activeObj.originalVwSize = newVwSize;
        }

        // 취소 처리
        function cancelEditing() {
            if (activeSlideId) {
                loadSlideToCanvas(activeSlideId);
            }
        }

        // 최종 데이터 패킷 서버 전송 (저장 및 Apply)
        function saveSlideData() {
            if (!activeSlideId || !projectData) return;

            const slide = projectData.slides.find(s => s.id === activeSlideId);
            if (!slide) return;

            const canvasWidth = canvas.getWidth();
            const canvasHeight = canvas.getHeight();

            // 캔버스의 모든 객체를 백분율 형태 스키마로 변환하여 취합
            const elements = [];
            canvas.getObjects().forEach(obj => {
                const xPct = (obj.left / canvasWidth) * 100;
                const yPct = (obj.top / canvasHeight) * 100;
                const wPct = ((obj.width * obj.scaleX) / canvasWidth) * 100;
                const hPct = ((obj.height * obj.scaleY) / canvasHeight) * 100;

                elements.push({
                    id: obj.originalId || `elem_${Math.random().toString(36).substr(2, 9)}`,
                    type: "text",
                    content: obj.text,
                    x: parseFloat(xPct.toFixed(2)),
                    y: parseFloat(yPct.toFixed(2)),
                    width: parseFloat(wPct.toFixed(2)),
                    height: parseFloat(hPct.toFixed(2)),
                    style: {
                        fontSize: obj.originalVwSize || "3vw",
                        fontColor: obj.fill
                    }
                });
            });

            const updatedSlide = {
                id: slide.id,
                name: slide.name,
                elements: elements
            };

            // 서버에 SAVE_SLIDE 발송 (백엔드가 뷰어 실시간 송출 갱신 여부를 판별함)
            ws.send(JSON.stringify({
                type: "SAVE_SLIDE",
                slide: updatedSlide
            }));

            // 로컬 데이터 선 갱신
            const idx = projectData.slides.findIndex(s => s.id === activeSlideId);
            if (idx !== -1) {
                projectData.slides[idx] = updatedSlide;
            }

            // 락 유지하고 저장 성공 얼럿
            alert("슬라이드가 저장 및 동기화되었습니다.");
            renderSlides();
        }

        // 웹소켓 연결
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=editor`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.add("connected");
                document.getElementById("status-text").innerText = "Connected (Editor)";
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'INITIAL_SYNC') {
                    projectData = message.data;
                    
                    // 락 정보 빌드 (slideId -> {ownerId, editorName})
                    lockedSlides = {};
                    for (const [slideId, wsSessionId] of Object.entries(message.lockedSlides || {})) {
                        lockedSlides[slideId] = {
                            ownerId: wsSessionId,
                            editorName: "다른 편집자"
                        };
                    }
                    
                    // 최초 동기화 수신 직후 내 세션 식별
                    // (FastAPI id(websocket)을 직접 받아오지 못할 수 있으나, INITIAL_SYNC 시 본인의 락 상태 매칭으로 알아내거나
                    // 단순 문자열 매칭으로 동시 락 충돌을 차단합니다.)
                    renderSlides();
                }
                else if (message.type === 'SLIDE_LOCKED') {
                    lockedSlides[message.slideId] = {
                        ownerId: message.ownerId,
                        editorName: message.editorName
                    };
                    
                    // 만약 본인이 락을 획득한 슬라이드인 경우
                    if (message.slideId === activeSlideId) {
                        myEditorId = message.ownerId; // 내 고유 세션 ID 할당
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UNLOCKED') {
                    delete lockedSlides[message.slideId];
                    renderSlides();
                }
                else if (message.type === 'LOCK_FAILED') {
                    alert(`잠금 획득 실패: ${message.reason}`);
                    if (activeSlideId === message.slideId) {
                        activeSlideId = null;
                        canvas.clear();
                        setControlsState(false);
                        document.getElementById("editor-title").innerText = "슬라이드를 선택해주세요.";
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UPDATED') {
                    // 타 편집기나 저장소에서 슬라이드가 변경된 경우 local 데이터 갱신
                    if (projectData) {
                        const idx = projectData.slides.findIndex(s => s.id === message.slideId);
                        if (idx !== -1) {
                            projectData.slides[idx] = message.slide;
                        } else {
                            projectData.slides.push(message.slide);
                        }
                        
                        // 현재 내 편집 뷰어 화면에 반영되어야 하고, 내가 락을 갖고 있지 않다면 리로드
                        if (activeSlideId === message.slideId && lockedSlides[activeSlideId]?.ownerId !== myEditorId) {
                            loadSlideToCanvas(activeSlideId);
                        }
                        renderSlides();
                    }
                }
            };

            ws.onclose = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.remove("connected");
                document.getElementById("status-text").innerText = "Disconnected";
                setTimeout(connectWebSocket, 3000);
            };
        }

        window.onload = () => {
            initCanvas();
            connectWebSocket();

            // 텍스트 내용 편집
            document.getElementById("text-editor").oninput = (e) => {
                if (currentEditingElement) {
                    currentEditingElement.set('text', e.target.value);
                    canvas.renderAll();
                }
            };

            // 폰트 크기 변경
            document.getElementById("fontsize-editor").oninput = (e) => {
                if (currentEditingElement) {
                    const vw = parseFloat(e.target.value) || 3.0;
                    const pxSize = (vw / 100) * canvas.getWidth();
                    
                    currentEditingElement.set('fontSize', pxSize);
                    currentEditingElement.originalVwSize = `${vw}vw`;
                    canvas.renderAll();
                }
            };

            // 폰트 색상 변경
            document.getElementById("fontcolor-editor").oninput = (e) => {
                if (currentEditingElement) {
                    currentEditingElement.set('fill', e.target.value);
                    canvas.renderAll();
                }
            };

            // 저장/취소 리스너
            document.getElementById("btn-save").onclick = saveSlideData;
            document.getElementById("btn-cancel").onclick = cancelEditing;

            // 창 닫을 때 락 자동 반환
            window.onbeforeunload = () => {
                releaseActiveLock();
            };
        };
    </script>
</body>
</html>
