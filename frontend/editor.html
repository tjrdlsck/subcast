<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Subcast - 실시간 편집기 (Editor)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(24px);
            --primary: #007aff;
            --primary-glow: rgba(0, 122, 255, 0.3);
            --secondary: #0067c0;
            --accent-live: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --green-online: #34c759;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(0, 122, 255, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(255, 59, 48, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: var(--panel-blur);
            -webkit-backdrop-filter: var(--panel-blur);
            border-bottom: 1px solid var(--panel-border);
            position: sticky; top: 0; z-index: 100;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem; font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-controls { display: flex; align-items: center; gap: 20px; }
        .editor-name-group { display: flex; align-items: center; gap: 12px; }
        .editor-name-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        .editor-name-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 8px 16px; color: white; font-size: 0.85rem;
            transition: all 0.2s ease;
            width: 140px;
        }
        .editor-name-input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .status-badge {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; font-weight: 600;
            padding: 8px 16px; border-radius: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: var(--panel-blur);
            box-shadow: var(--shadow-sm);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-live); }
        .status-badge.connected .status-dot { background-color: var(--green-online); box-shadow: 0 0 8px var(--green-online); }

        .workspace {
            flex: 1; display: grid; grid-template-columns: 320px 1fr;
            height: calc(100vh - 70px);
        }

        .slide-panel {
            background: rgba(18, 18, 18, 0.5);
            backdrop-filter: var(--panel-blur);
            border-right: 1px solid var(--panel-border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .panel-header {
            padding: 24px 20px 12px 20px; font-weight: 600; font-size: 1rem; color: var(--text-main);
        }
        .slide-list {
            flex: 1; overflow-y: auto; padding: 12px 20px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .slide-item {
            background: var(--panel-bg);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 16px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
        }
        .slide-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .slide-item.editing {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }
        .slide-item.editing::before, .slide-item.locked::before {
            position: absolute; bottom: 12px; right: 12px;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px;
            padding: 4px 8px; border-radius: 6px;
        }
        .slide-item.editing::before {
            content: 'EDITING'; background: var(--primary); color: white;
        }
        .slide-item.locked { opacity: 0.5; pointer-events: none; }
        .slide-item.locked::before {
            content: 'LOCKED'; background: var(--accent-live); color: white;
        }

        .slide-item-checkbox {
            margin-right: 12px;
            margin-top: 4px;
            width: 16px; height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .slide-item-content { flex: 1; min-width: 0; }
        .slide-item h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }

        .slide-item-preview-img {
            width: 100%; aspect-ratio: 16/9;
            object-fit: contain; background: #000;
            border-radius: 6px; margin-bottom: 8px;
            border: 1px solid var(--panel-border);
        }
        .slide-preview-text { font-size: 0.8rem; color: var(--text-muted); }
        .lock-owner-text { font-size: 0.75rem; color: #ff6b6b; margin-top: 8px; font-weight: 500; }

        .editor-container {
            display: flex; flex-direction: column; padding: 24px 32px;
            gap: 24px; overflow-y: auto; align-items: center;
        }
        .editor-workspace {
            width: 100%; max-width: 1024px; display: flex; flex-direction: column; gap: 20px;
        }

        .ppt-ribbon-bar {
            background: var(--panel-bg);
            backdrop-filter: var(--panel-blur);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            width: 100%; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: var(--shadow-md);
        }
        .ribbon-tabs {
            display: flex; background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--panel-border);
        }
        .ribbon-tab-btn {
            background: transparent; border: none; border-bottom: 2px solid transparent;
            color: var(--text-muted); padding: 12px 24px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .ribbon-tab-btn:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .ribbon-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .ribbon-panels {
            padding: 16px 24px; background: rgba(255, 255, 255, 0.02);
            display: flex; align-items: center; min-height: 100px;
        }
        .ribbon-panel { display: none; width: 100%; align-items: center; gap: 32px; flex-wrap: wrap; }
        .ribbon-panel.active { display: flex; }
        .ribbon-group { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .ribbon-group-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .ribbon-group-divider { width: 1px; height: 48px; background: var(--panel-border); align-self: center; }

        .ribbon-action-btn, .btn-tool {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm); color: white;
            padding: 8px 16px; font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .ribbon-action-btn:hover:not(:disabled), .btn-tool:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1); transform: translateY(-1px);
        }
        .ribbon-action-btn:active:not(:disabled), .btn-tool:active:not(:disabled) {
            transform: translateY(1px);
        }

        .text-input-field, .fontSize-input, .select-field {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 8px 12px; color: white; font-size: 0.85rem;
            transition: all 0.2s; outline: none;
        }
        .text-input-field:focus, .fontSize-input:focus, .select-field:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .fontColor-input {
            width: 32px; height: 32px; padding: 0; border: 1px solid var(--panel-border);
            border-radius: 50%; cursor: pointer; overflow: hidden;
        }

        .editor-card {
            background: var(--panel-bg); backdrop-filter: var(--panel-blur);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-xl); padding: 32px;
            box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 24px;
        }
        .canvas-wrapper {
            width: 100%; aspect-ratio: 16/9;
            background: #1e1e1e;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0); background-size: 20px 20px;
            border: 1px solid var(--panel-border); border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .canvas-container {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .editor-controls {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--panel-border); padding-top: 24px; gap: 16px;
        }
        .btn-save { background: var(--primary); border-color: var(--primary); padding: 12px 24px; font-weight: 600; border-radius: var(--radius-md); cursor: pointer; color: white; transition: all 0.2s; }
        .btn-save:hover:not(:disabled) { background: #0062cc; transform: translateY(-2px); box-shadow: 0 4px 12px var(--primary-glow); }
        
        .btn-cancel { background: transparent; border: 1px solid var(--panel-border); padding: 12px 24px; font-weight: 600; border-radius: var(--radius-md); cursor: pointer; color: white; transition: all 0.2s; }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); }

        .lock-warning-banner {
            background: rgba(255, 59, 48, 0.15); border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff6b6b; padding: 16px 20px; border-radius: var(--radius-md);
            font-size: 0.9rem; font-weight: 500; width: 100%; display: none; align-items: center; gap: 12px;
        }

        .btn-toggle {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border);
            color: white; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s;
        }
        .btn-toggle:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
        .btn-toggle.active { background: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <h1>Subcast Editor</h1>
        <div class="header-controls">
            <div class="editor-name-group">
                <label for="editor-name">내 이름</label>
                <input type="text" id="editor-name" class="editor-name-input" value="편집자A">
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <!-- 왼쪽: 슬라이드 목록 -->
        <div class="slide-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>슬라이드 리스트</span>
                <button class="ribbon-action-btn" id="btn-add-slide" style="padding: 4px 8px; font-size: 0.75rem; background: var(--accent); border-color: var(--accent); cursor: pointer;">+ 새 슬라이드</button>
            </div>
            <div class="slide-list" id="slide-list">
                <!-- 동적 렌더링 -->
            </div>
        </div>

        <!-- 오른쪽: 편집기 캔버스 영역 -->
        <div class="editor-container">
            <div class="editor-workspace">
                <!-- 편집 잠금 상태 알림 배너 -->
                <div class="lock-warning-banner" id="lock-banner">
                    ⚠️ 다른 사용자가 편집 중인 슬라이드입니다.
                </div>

                <div class="editor-card">
                    <h3 style="font-family: 'Outfit'; font-size: 1.2rem; font-weight: 600;" id="editor-title">슬라이드를 선택해주세요.</h3>
                    
                    <!-- PPT 스타일 리본 메뉴 -->
                    <div class="ppt-ribbon-bar">
                        <!-- 탭 버튼들 -->
                        <div class="ribbon-tabs">
                            <button class="ribbon-tab-btn active" id="tab-btn-insert" onclick="switchRibbonTab('tab-insert')">삽입 (Insert)</button>
                            <button class="ribbon-tab-btn" id="tab-btn-format" onclick="switchRibbonTab('tab-format')">서식 (Format)</button>
                            <button class="ribbon-tab-btn" id="tab-btn-arrange" onclick="switchRibbonTab('tab-arrange')">정렬 및 그룹 (Arrange)</button>
                        </div>
                        
                        <!-- 탭 패널들 -->
                        <div class="ribbon-panels">
                            <!-- [삽입] 탭 패널 -->
                            <div class="ribbon-panel active" id="tab-insert">
                                <div class="ribbon-group">
                                    <div class="ribbon-group-label">텍스트</div>
                                    <button class="ribbon-action-btn" id="btn-add-text" disabled>
                                        <span class="ribbon-icon">T</span>
                                        텍스트 추가
                                    </button>
                                </div>
                                <div class="ribbon-group-divider"></div>
                                <div class="ribbon-group">
                                    <div class="ribbon-group-label">도형 및 선</div>
                                    <div style="display: flex; gap: 8px;">
                                        <button class="ribbon-action-btn" id="btn-add-rect" disabled>
                                            <span class="ribbon-icon">■</span>
                                            사각형
                                        </button>
                                        <button class="ribbon-action-btn" id="btn-add-circle" disabled>
                                            <span class="ribbon-icon">●</span>
                                            원형
                                        </button>
                                        <button class="ribbon-action-btn" id="btn-add-triangle" disabled>
                                            <span class="ribbon-icon">▲</span>
                                            삼각형
                                        </button>
                                        <button class="ribbon-action-btn" id="btn-add-line" disabled>
                                            <span class="ribbon-icon">━</span>
                                            직선
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- [서식] 탭 패널 -->
                            <div class="ribbon-panel" id="tab-format">
                                <div style="display: flex; gap: 15px; width: 100%; flex-wrap: wrap; align-items: center;">
                                    <!-- 공통 속성 -->
                                    <div class="ribbon-group">
                                        <div class="ribbon-group-label">공통 속성</div>
                                        <div class="property-group">
                                            <label for="element-opacity">불투명도</label>
                                            <input type="range" id="element-opacity" min="0" max="1" step="0.05" value="1" style="width: 70px;" disabled>
                                            <span id="opacity-val" style="font-size: 0.8rem; min-width: 32px; text-align: right;">100%</span>
                                        </div>
                                    </div>
                                    <div class="ribbon-group-divider"></div>
                                    
                                    <!-- 텍스트 서식 -->
                                    <div class="ribbon-group" id="ribbon-text-format" style="opacity: 0.4; pointer-events: none;">
                                        <div class="ribbon-group-label">텍스트 서식</div>
                                        <div style="display: flex; gap: 10px; align-items: center;">
                                            <input type="text" id="text-editor" class="text-input-field" placeholder="텍스트 내용 입력" style="width: 140px;" disabled>
                                            <select id="fontfamily-editor" class="select-field" style="padding: 6px 10px;" disabled>
                                                <option value="Inter">Inter</option>
                                                <option value="Outfit">Outfit</option>
                                                <option value="Arial">Arial</option>
                                                <option value="Georgia">Georgia</option>
                                                <option value="Courier New">Courier New</option>
                                            </select>
                                            <input type="number" id="fontsize-editor" class="fontSize-input" value="3" min="0.5" max="20" step="0.1" style="width: 55px; padding: 6px;" disabled>
                                            <span style="font-size: 0.8rem; color: var(--text-muted);">vw</span>
                                            <input type="color" id="fontcolor-editor" class="fontColor-input" value="#ffffff" style="width: 32px; height: 32px;" disabled>
                                            <div style="display: flex; gap: 4px;">
                                                <button class="btn-toggle" id="btn-bold" title="굵게" style="width:32px; height:32px;" disabled>B</button>
                                                <button class="btn-toggle" id="btn-italic" title="기울임" style="width:32px; height:32px;" disabled>I</button>
                                            </div>
                                            <div style="display: flex; gap: 4px;">
                                                <button class="btn-toggle" id="btn-align-left" title="왼쪽 정렬" style="width:32px; height:32px;" disabled>L</button>
                                                <button class="btn-toggle" id="btn-align-center" title="가운데 정렬" style="width:32px; height:32px;" disabled>C</button>
                                                <button class="btn-toggle" id="btn-align-right" title="오른쪽 정렬" style="width:32px; height:32px;" disabled>R</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="ribbon-group-divider"></div>
                                    
                                    <!-- 도형 서식 -->
                                    <div class="ribbon-group" id="ribbon-shape-format" style="opacity: 0.4; pointer-events: none;">
                                        <div class="ribbon-group-label">도형 서식</div>
                                        <div style="display: flex; gap: 10px; align-items: center;">
                                            <div class="property-group">
                                                <label for="shape-fillcolor">채우기</label>
                                                <input type="color" id="shape-fillcolor" class="fontColor-input" value="#4f46e5" style="width: 32px; height: 32px;" disabled>
                                            </div>
                                            <div class="property-group">
                                                <label for="shape-strokecolor">테두리</label>
                                                <input type="color" id="shape-strokecolor" class="fontColor-input" value="#ffffff" style="width: 32px; height: 32px;" disabled>
                                            </div>
                                            <div class="property-group">
                                                <label for="shape-strokewidth">두께</label>
                                                <input type="number" id="shape-strokewidth" class="fontSize-input" value="0" min="0" max="20" step="1" style="width: 50px; padding: 6px;" disabled>
                                                <span style="font-size: 0.8rem; color: var(--text-muted);">px</span>
                                            </div>
                                            <div class="property-group" id="corner-rounding-group">
                                                <label for="shape-corners">모서리</label>
                                                <input type="number" id="shape-corners" class="fontSize-input" value="0" min="0" max="100" step="1" style="width: 50px; padding: 6px;" disabled>
                                                <span style="font-size: 0.8rem; color: var(--text-muted);">px</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="ribbon-group-divider"></div>

                                    <!-- 디자인 템플릿 그룹 -->
                                    <div class="ribbon-group">
                                        <div class="ribbon-group-label">디자인 템플릿</div>
                                        <div style="display: flex; gap: 10px; align-items: center;">
                                            <button class="ribbon-action-btn" id="btn-save-template" style="padding: 6px 12px; font-size: 0.8rem;" disabled>현재 디자인을 템플릿으로 저장</button>
                                            <select id="select-templates" class="select-field" style="padding: 6px 10px; width: 150px; font-size: 0.8rem;" disabled>
                                                <option value="">-- 템플릿 선택 --</option>
                                            </select>
                                            <button class="ribbon-action-btn" id="btn-apply-template-bulk" style="padding: 6px 12px; font-size: 0.8rem;" disabled>선택 슬라이드에 적용</button>
                                            <button class="ribbon-action-btn" id="btn-delete-template" style="padding: 6px 12px; font-size: 0.8rem; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.25); color: #fca5a5;" disabled>삭제</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- [정렬 및 그룹] 탭 패널 -->
                            <div class="ribbon-panel" id="tab-arrange">
                                <div class="ribbon-group">
                                    <div class="ribbon-group-label">순서 배치 (Z-Index)</div>
                                    <div style="display: flex; gap: 8px;">
                                        <button class="ribbon-action-btn" id="btn-layer-up" disabled>앞으로</button>
                                        <button class="ribbon-action-btn" id="btn-layer-down" disabled>뒤로</button>
                                        <button class="ribbon-action-btn" id="btn-layer-front" disabled>맨 앞으로</button>
                                        <button class="ribbon-action-btn" id="btn-layer-back" disabled>맨 뒤로</button>
                                    </div>
                                </div>
                                <div class="ribbon-group-divider"></div>
                                <div class="ribbon-group">
                                    <div class="ribbon-group-label">개체 그룹화</div>
                                    <div style="display: flex; gap: 8px;">
                                        <button class="ribbon-action-btn" id="btn-group" disabled>그룹 묶기 (Group)</button>
                                        <button class="ribbon-action-btn" id="btn-ungroup" disabled>그룹 풀기 (Ungroup)</button>
                                    </div>
                                </div>
                                <div class="ribbon-group-divider"></div>
                                <div class="ribbon-group">
                                    <div class="ribbon-group-label">편집 제어</div>
                                    <button class="ribbon-action-btn" id="btn-delete" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.25); color: #fca5a5;" disabled>개체 삭제 (Delete)</button>
                                </div>
                            </div>
                        </div>
                    <div class="canvas-wrapper">
                        <canvas id="editor-canvas"></canvas>
                    </div>

                    <!-- 선택 개체 간략 상태표시줄 -->
                    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.01); border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 16px; font-size: 0.82rem; width: 100%;">
                        <span id="selection-status-bar" style="color: var(--text-muted); font-weight: 500;">선택된 개체가 없습니다.</span>
                        
                        <!-- 액션 저장/취소 그룹 -->
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button class="btn-tool btn-cancel" id="btn-cancel" style="padding: 6px 14px; font-size:0.82rem;" disabled>취소</button>
                            <button class="btn-tool btn-save" id="btn-save" style="padding: 6px 14px; font-size:0.82rem;" disabled>저장 (Apply)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CanvasTextBaseline 패치: 브라우저 확장 프로그램 등에서 'alphabetical'을 넣어 발생하는 경고 우회
        (function() {
            if (typeof CanvasRenderingContext2D !== 'undefined') {
                const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
                if (descriptor && descriptor.set) {
                    const originalSet = descriptor.set;
                    Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
                        set: function(value) {
                            if (value === 'alphabetical') {
                                value = 'alphabetic';
                            }
                            originalSet.call(this, value);
                        },
                        get: descriptor.get,
                        enumerable: descriptor.enumerable,
                        configurable: descriptor.configurable
                    });
                }
            }
        })();

        let ws = null;
        let projectData = null;
        let lockedSlides = {};
        let activeSlideId = null;
        let canvas = null;
        let myEditorId = null;
        let currentEditingElement = null;

        // 백그라운드에서 썸네일을 자동 생성하는 함수
        function autoGenerateThumbnail(slide) {
            if (slide.thumbnail) return Promise.resolve(slide.thumbnail);
            
            return new Promise((resolve) => {
                const tempCanvasEl = document.createElement('canvas');
                tempCanvasEl.width = 768;
                tempCanvasEl.height = 432;
                
                const tempCanvas = new fabric.StaticCanvas(tempCanvasEl, {
                    backgroundColor: '#111827'
                });
                
                slide.elements.forEach(elem => {
                    const obj = deserializeElement(elem, 768, 432);
                    if (obj) tempCanvas.add(obj);
                });
                
                tempCanvas.renderAll();
                
                const dataUrl = tempCanvas.toDataURL({
                    format: 'jpeg',
                    quality: 0.4
                });
                
                tempCanvas.dispose();
                slide.thumbnail = dataUrl;
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "SAVE_SLIDE",
                        slide: slide
                    }));
                }
                
                resolve(dataUrl);
            });
        }

        function switchRibbonTab(tabId) {
            document.querySelectorAll('.ribbon-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.ribbon-panel').forEach(panel => panel.classList.remove('active'));
            const targetBtn = document.getElementById(`tab-btn-${tabId.replace('tab-', '')}`);
            if (targetBtn) targetBtn.classList.add('active');
            const targetPanel = document.getElementById(tabId);
            if (targetPanel) targetPanel.classList.add('active');
        }

        function initCanvas() {
            canvas = new fabric.Canvas('editor-canvas', {
                width: 768,
                height: 432,
                backgroundColor: '#111827',
                preserveObjectStacking: true
            });
            canvas.on('selection:created', onObjectSelected);
            canvas.on('selection:updated', onObjectSelected);
            canvas.on('selection:cleared', onObjectCleared);
            canvas.on('object:moving', onObjectModified);
            canvas.on('object:scaling', onObjectModified);
        }

        let lastCheckedIndex = -1;

        function handleCheckboxClick(e, index) {
            e.stopPropagation();
            const checkboxes = document.querySelectorAll(".slide-select-checkbox");
            
            if (e.shiftKey && lastCheckedIndex !== -1) {
                const start = Math.min(index, lastCheckedIndex);
                const end = Math.max(index, lastCheckedIndex);
                const targetState = e.target.checked;
                
                for (let i = start; i <= end; i++) {
                    checkboxes[i].checked = targetState;
                }
            }
            lastCheckedIndex = index;
        }

        function renderSlides() {
            const listEl = document.getElementById("slide-list");
            listEl.innerHTML = "";
            if (!projectData || !projectData.slides) return;
            projectData.slides.forEach((slide, index) => {
                const item = document.createElement("div");
                item.className = "slide-item";
                item.id = `slide-item-${slide.id}`;
                item.style.position = "relative";
                if (slide.id === activeSlideId) item.classList.add("editing");
                const lockOwner = lockedSlides[slide.id];
                const isLockedByOthers = lockOwner !== undefined && lockOwner.ownerId !== myEditorId;
                if (isLockedByOthers) item.classList.add("locked");
                
                item.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <input type="checkbox" class="slide-select-checkbox" data-slide-id="${slide.id}" style="width:16px; height:16px; cursor:pointer; flex-shrink: 0; margin-top: 2px; z-index: 10; position: relative;" onclick="handleCheckboxClick(event, ${index})">
                        <div style="flex: 1; min-width: 0;">
                            <h3 style="margin: 0 0 8px 0; font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 60px;">${index + 1}. ${slide.name}</h3>
                            <div class="slide-thumbnail-wrapper" style="width: 100%; height: 90px; background: #0b0f19; border-radius: 8px; overflow: hidden; border: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: center;">
                                ${slide.thumbnail ? `<img src="${slide.thumbnail}" style="width: 100%; height: 100%; object-fit: contain;">` : `<span style="font-size: 0.72rem; color: var(--text-muted);">미리보기 없음</span>`}
                            </div>
                            ${isLockedByOthers ? `<div class="lock-owner-text" style="margin-top: 4px;">🔒 ${lockOwner.editorName}님이 편집 중</div>` : ''}
                        </div>
                    </div>
                `;
                if (!isLockedByOthers) item.onclick = () => selectSlideForEdit(slide.id);
                listEl.appendChild(item);
            });
        }

        function selectSlideForEdit(slideId) {
            if (activeSlideId === slideId) return;
            if (activeSlideId) releaseActiveLock();
            activeSlideId = slideId;
            document.getElementById("editor-title").innerText = `슬라이드 편집: ${projectData.slides.find(s => s.id === slideId).name}`;
            const editorName = document.getElementById("editor-name").value;
            ws.send(JSON.stringify({ type: "LOCK_SLIDE", slideId: slideId, editorName: editorName }));
            loadSlideToCanvas(slideId);
            setControlsState(true);
            renderSlides();
        }

        function releaseActiveLock() {
            if (ws && ws.readyState === WebSocket.OPEN && activeSlideId) {
                ws.send(JSON.stringify({ type: "UNLOCK_SLIDE", slideId: activeSlideId }));
            }
        }

        function deserializeElement(elem, canvasWidth, canvasHeight, isInsideGroup = false, groupW = 1, groupH = 1) {
            let x, y, w, h;
            if (isInsideGroup) {
                x = (elem.x / 100) * groupW;
                y = (elem.y / 100) * groupH;
                w = (elem.width / 100) * groupW;
                h = (elem.height / 100) * groupH;
            } else {
                x = (elem.x / 100) * canvasWidth;
                y = (elem.y / 100) * canvasHeight;
                w = (elem.width / 100) * canvasWidth;
                h = (elem.height / 100) * canvasHeight;
            }
            let obj = null;
            const opacity = elem.style?.opacity !== undefined ? elem.style.opacity : 1.0;
            if (elem.type === 'text') {
                let fontSize = 20;
                if (elem.style?.fontSize) {
                    const match = elem.style.fontSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                    fontSize = match ? (parseFloat(match[1]) / 100) * (isInsideGroup ? groupW : canvasWidth) : parseInt(elem.style.fontSize) || 20;
                }
                const textOptions = { left: x, top: y, width: w > 50 ? w : 250, fontSize: fontSize, fill: elem.style?.fontColor || '#ffffff', fontFamily: elem.style?.fontFamily || 'Inter', fontWeight: elem.style?.fontWeight || 'normal', fontStyle: elem.style?.fontStyle || 'normal', textAlign: elem.style?.textAlign || 'left', opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id, originalVwSize: elem.style?.fontSize || "3vw" };
                obj = isInsideGroup ? new fabric.Text(elem.content, textOptions) : new fabric.Textbox(elem.content, textOptions);
            } else if (elem.type === 'rect') {
                obj = new fabric.Rect({ left: x, top: y, width: w, height: h, rx: elem.style?.cornerRadius || 0, ry: elem.style?.cornerRadius || 0, fill: elem.style?.fillColor || '#4f46e5', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'circle') {
                obj = new fabric.Circle({ left: x, top: y, radius: w / 2 || 30, fill: elem.style?.fillColor || '#06b6d4', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'triangle') {
                obj = new fabric.Triangle({ left: x, top: y, width: w, height: h, fill: elem.style?.fillColor || '#10b981', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'line') {
                obj = new fabric.Line([x, y, x + w, y], { stroke: elem.style?.fillColor || elem.style?.strokeColor || '#f59e0b', strokeWidth: elem.style?.strokeWidth !== undefined && elem.style?.strokeWidth > 0 ? elem.style.strokeWidth : 4, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'group' && elem.children) {
                const members = elem.children.map(child => deserializeElement(child, canvasWidth, canvasHeight, true, w, h));
                obj = new fabric.Group(members, { left: x, top: y, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            }
            return obj;
        }

        function serializeElement(obj, canvasWidth, canvasHeight, isInsideGroup = false, groupW = 1, groupH = 1) {
            let xPct, yPct, wPct, hPct;
            if (isInsideGroup) {
                xPct = (obj.left / groupW) * 100;
                yPct = (obj.top / groupH) * 100;
                wPct = ((obj.width * obj.scaleX) / groupW) * 100;
                hPct = ((obj.height * obj.scaleY) / groupH) * 100;
            } else {
                xPct = (obj.left / canvasWidth) * 100;
                yPct = (obj.top / canvasHeight) * 100;
                wPct = obj.type === 'circle' ? (((obj.radius * (obj.scaleX || 1)) * 2) / canvasWidth) * 100 : ((obj.width * obj.scaleX) / canvasWidth) * 100;
                hPct = obj.type === 'circle' ? (((obj.radius * (obj.scaleY || 1)) * 2) / canvasHeight) * 100 : ((obj.height * obj.scaleY) / canvasHeight) * 100;
            }
            const type = (obj.type === 'textbox' || obj.type === 'text') ? 'text' : obj.type;
            const style = { opacity: obj.opacity !== undefined ? parseFloat(obj.opacity.toFixed(2)) : 1.0 };
            if (type === 'text') {
                style.fontSize = obj.originalVwSize || "3vw";
                style.fontColor = obj.fill;
                style.fontFamily = obj.fontFamily || "Inter";
                style.fontWeight = obj.fontWeight || "normal";
                style.fontStyle = obj.fontStyle || "normal";
                style.textAlign = obj.textAlign || "left";
            } else if (['rect', 'circle', 'triangle', 'line'].includes(type)) {
                style.fillColor = obj.fill || "transparent";
                style.strokeColor = obj.stroke || "transparent";
                style.strokeWidth = obj.strokeWidth || 0;
                if (type === 'rect') style.cornerRadius = obj.rx || 0;
            }
            const elementData = { id: obj.originalId || `elem_${Math.random().toString(36).substr(2, 9)}`, type: type, content: type === 'text' ? (obj.text || "") : "", x: parseFloat(xPct.toFixed(2)), y: parseFloat(yPct.toFixed(2)), width: parseFloat(wPct.toFixed(2)), height: parseFloat(hPct.toFixed(2)), style: style };
            if (type === 'group') {
                elementData.children = obj.getObjects().map(child => serializeElement(child, canvasWidth, canvasHeight, true, obj.width * obj.scaleX, obj.height * obj.scaleY));
            }
            return elementData;
        }

        function loadSlideToCanvas(slideId) {
            canvas.clear();
            const slide = projectData.slides.find(s => s.id === slideId);
            if (!slide) return;
            slide.elements.forEach(elem => {
                const obj = deserializeElement(elem, canvas.getWidth(), canvas.getHeight());
                if (obj) canvas.add(obj);
            });
            canvas.renderAll();
        }

        function setControlsState(enabled) {
            ['btn-add-text', 'btn-add-rect', 'btn-add-circle', 'btn-add-triangle', 'btn-add-line', 'btn-save', 'btn-cancel', 'btn-save-template', 'select-templates', 'btn-apply-template-bulk', 'btn-delete-template'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !enabled;
            });
            if (!enabled) onObjectCleared();
        }

        function onObjectSelected(e) {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;
            currentEditingElement = activeObj;
            ['btn-layer-up', 'btn-layer-down', 'btn-layer-front', 'btn-layer-back', 'btn-delete'].forEach(id => document.getElementById(id).disabled = false);
            const opacitySlider = document.getElementById("element-opacity");
            opacitySlider.disabled = false;
            opacitySlider.value = activeObj.opacity !== undefined ? activeObj.opacity : 1;
            document.getElementById("opacity-val").innerText = `${Math.round(opacitySlider.value * 100)}%`;
            document.getElementById("btn-group").disabled = activeObj.type !== 'activeSelection';
            document.getElementById("btn-ungroup").disabled = activeObj.type !== 'group';
            document.getElementById("selection-status-bar").innerText = `선택된 개체: ${activeObj.type} (${activeObj.originalId || '신규'})`;
            const textGroup = document.getElementById("ribbon-text-format"), shapeGroup = document.getElementById("ribbon-shape-format");
            if (activeObj.type === 'textbox' || activeObj.type === 'text') {
                textGroup.style.cssText = "opacity: 1; pointer-events: auto;"; shapeGroup.style.cssText = "opacity: 0.4; pointer-events: none;";
                ['text-editor', 'fontfamily-editor', 'fontsize-editor', 'fontcolor-editor', 'btn-bold', 'btn-italic', 'btn-align-left', 'btn-align-center', 'btn-align-right'].forEach(id => document.getElementById(id).disabled = false);
                document.getElementById("text-editor").value = activeObj.text || "";
                document.getElementById("fontsize-editor").value = parseFloat(activeObj.originalVwSize) || 3.0;
                document.getElementById("fontcolor-editor").value = activeObj.fill || "#ffffff";
            } else if (['rect', 'circle', 'triangle', 'line'].includes(activeObj.type)) {
                textGroup.style.cssText = "opacity: 0.4; pointer-events: none;"; shapeGroup.style.cssText = "opacity: 1; pointer-events: auto;";
                ['shape-fillcolor', 'shape-strokecolor', 'shape-strokewidth'].forEach(id => document.getElementById(id).disabled = false);
                const cornerInput = document.getElementById("shape-corners");
                cornerInput.disabled = activeObj.type !== 'rect';
                cornerInput.value = activeObj.rx || 0;
            }
        }

        function onObjectCleared() {
            currentEditingElement = null;
            document.getElementById("selection-status-bar").innerText = "선택된 개체가 없습니다.";
            document.getElementById("ribbon-text-format").style.cssText = "opacity: 0.4; pointer-events: none;";
            document.getElementById("ribbon-shape-format").style.cssText = "opacity: 0.4; pointer-events: none;";
            document.getElementById("element-opacity").disabled = true;
            ['btn-layer-up', 'btn-layer-down', 'btn-layer-front', 'btn-layer-back', 'btn-delete', 'btn-group', 'btn-ungroup'].forEach(id => document.getElementById(id).disabled = true);
        }

        function onObjectModified(e) {
            const activeObj = e.target;
            if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
                activeObj.originalVwSize = `${((activeObj.fontSize * (activeObj.scaleX || 1) / canvas.getWidth()) * 100).toFixed(2)}vw`;
            }
        }

        function cancelEditing() { if (activeSlideId) loadSlideToCanvas(activeSlideId); }

        function addText() {
            if (!activeSlideId) return;
            const obj = new fabric.Textbox("텍스트를 입력하세요", { left: 100, top: 100, width: 250, fontSize: (3 / 100) * canvas.getWidth(), fill: '#ffffff', fontFamily: 'Inter', originalId: `elem_${Math.random().toString(36).substr(2, 9)}`, originalVwSize: "3vw" });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addRect() {
            if (!activeSlideId) return;
            const obj = new fabric.Rect({ left: 150, top: 150, width: 150, height: 100, fill: '#4f46e5', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addCircle() {
            if (!activeSlideId) return;
            const obj = new fabric.Circle({ left: 150, top: 150, radius: 60, fill: '#06b6d4', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addTriangle() {
            if (!activeSlideId) return;
            const obj = new fabric.Triangle({ left: 150, top: 150, width: 120, height: 100, fill: '#10b981', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addLine() {
            if (!activeSlideId) return;
            const obj = new fabric.Line([50, 50, 200, 50], { left: 150, top: 150, stroke: '#f59e0b', strokeWidth: 4, originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function layerUp() { if (currentEditingElement) { canvas.bringForward(currentEditingElement); canvas.renderAll(); } }
        function layerDown() { if (currentEditingElement) { canvas.sendBackwards(currentEditingElement); canvas.renderAll(); } }
        function layerFront() { if (currentEditingElement) { canvas.bringToFront(currentEditingElement); canvas.renderAll(); } }
        function layerBack() { if (currentEditingElement) { canvas.sendToBack(currentEditingElement); canvas.renderAll(); } }

        function groupObjects() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'activeSelection') {
                const group = activeObj.toGroup();
                group.originalId = `elem_${Math.random().toString(36).substr(2, 9)}`;
                canvas.requestRenderAll();
                onObjectSelected({ target: group });
            }
        }

        function ungroupObjects() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'group') {
                activeObj.toActiveSelection();
                canvas.requestRenderAll();
                onObjectSelected({ target: canvas.getActiveObject() });
            }
        }

        function deleteElement() {
            if (currentEditingElement) { canvas.remove(currentEditingElement); canvas.discardActiveObject(); onObjectCleared(); canvas.renderAll(); }
        }

        function saveSlideData() {
            if (!activeSlideId || !projectData) return;
            const slide = projectData.slides.find(s => s.id === activeSlideId);
            
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvas.discardActiveObject();
                canvas.requestRenderAll();
            }
            
            const thumbnailData = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.4
            });
            
            if (activeObj) {
                canvas.setActiveObject(activeObj);
                canvas.requestRenderAll();
            }

            const elements = canvas.getObjects().map(obj => serializeElement(obj, canvas.getWidth(), canvas.getHeight()));
            const updatedSlide = { id: slide.id, name: slide.name, thumbnail: thumbnailData, elements: elements };
            ws.send(JSON.stringify({ type: "SAVE_SLIDE", slide: updatedSlide }));
            const idx = projectData.slides.findIndex(s => s.id === activeSlideId);
            if (idx !== -1) projectData.slides[idx] = updatedSlide;
            alert("슬라이드가 저장 및 동기화되었습니다.");
            renderSlides();
        }

        function addSlide() {
            ws.send(JSON.stringify({ type: "ADD_SLIDE" }));
        }

        function saveAsTemplate() {
            if (!activeSlideId || !canvas) return;
            const tplName = prompt("저장할 템플릿의 이름을 입력하세요:", "새 디자인 템플릿");
            if (!tplName) return;

            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvas.discardActiveObject();
                canvas.requestRenderAll();
            }
            
            const thumbnailData = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.4
            });
            
            if (activeObj) {
                canvas.setActiveObject(activeObj);
                canvas.requestRenderAll();
            }

            const elements = canvas.getObjects().map(obj => serializeElement(obj, canvas.getWidth(), canvas.getHeight()));
            const templateData = {
                id: `tpl_${Math.random().toString(36).substr(2, 9)}`,
                name: tplName,
                thumbnail: thumbnailData,
                elements: elements
            };

            ws.send(JSON.stringify({
                type: "SAVE_TEMPLATE",
                template: templateData
            }));
        }

        function deleteTemplate() {
            const selectEl = document.getElementById("select-templates");
            const tplId = selectEl.value;
            if (!tplId) {
                alert("삭제할 템플릿을 먼저 선택해주세요.");
                return;
            }
            if (confirm("정말로 이 템플릿을 삭제하시겠습니까?")) {
                ws.send(JSON.stringify({
                    type: "DELETE_TEMPLATE",
                    templateId: tplId
                }));
            }
        }

        function applyTemplateBulk() {
            const selectEl = document.getElementById("select-templates");
            const tplId = selectEl.value;
            if (!tplId) {
                alert("적용할 템플릿을 선택해주세요.");
                return;
            }

            const checkboxes = document.querySelectorAll(".slide-select-checkbox:checked");
            const slideIds = Array.from(checkboxes).map(cb => cb.getAttribute("data-slide-id"));
            if (slideIds.length === 0) {
                alert("템플릿을 일괄 적용할 슬라이드를 왼쪽 목록에서 체크박스로 선택해주세요.");
                return;
            }

            if (confirm(`선택한 ${slideIds.length}개의 슬라이드에 디자인 템플릿을 일괄 적용하시겠습니까? (기존 요소들은 모두 교체됩니다.)`)) {
                ws.send(JSON.stringify({
                    type: "APPLY_TEMPLATE_BULK",
                    slideIds: slideIds,
                    templateId: tplId
                }));
            }
        }

        function renderTemplates() {
            const selectEl = document.getElementById("select-templates");
            if (!selectEl) return;
            selectEl.innerHTML = '<option value="">-- 템플릿 선택 --</option>';
            if (!projectData || !projectData.templates) return;
            projectData.templates.forEach(tpl => {
                const opt = document.createElement("option");
                opt.value = tpl.id;
                opt.innerText = tpl.name;
                selectEl.appendChild(opt);
            });
        }

        function connectWebSocket() {
            ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws?role=editor`);
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'INITIAL_SYNC') { 
                    projectData = message.data; 
                    renderSlides(); 
                    renderTemplates();

                    // 썸네일이 없는 슬라이드가 있다면 순차적으로 자동 생성하여 반영 및 서버 동기화
                    let needsUpdate = false;
                    const promises = projectData.slides.map(slide => {
                        if (!slide.thumbnail) {
                            needsUpdate = true;
                            return autoGenerateThumbnail(slide);
                        }
                        return Promise.resolve();
                    });
                    
                    if (needsUpdate) {
                        Promise.all(promises).then(() => {
                            renderSlides();
                        });
                    }
                }
                else if (message.type === 'SLIDE_LOCKED') { lockedSlides[message.slideId] = { ownerId: message.ownerId, editorName: message.editorName }; if (message.slideId === activeSlideId) myEditorId = message.ownerId; renderSlides(); }
                else if (message.type === 'SLIDE_UNLOCKED') { delete lockedSlides[message.slideId]; renderSlides(); }
                else if (message.type === 'SLIDE_UPDATED') { const idx = projectData.slides.findIndex(s => s.id === message.slideId); if (idx !== -1) projectData.slides[idx] = message.slide; if (activeSlideId === message.slideId && lockedSlides[activeSlideId]?.ownerId !== myEditorId) loadSlideToCanvas(activeSlideId); renderSlides(); }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        window.onload = () => {
            initCanvas();
            connectWebSocket();

            // 슬라이드 추가 버튼
            document.getElementById("btn-add-slide").onclick = addSlide;

            // 템플릿 제어 버튼
            document.getElementById("btn-save-template").onclick = saveAsTemplate;
            document.getElementById("btn-apply-template-bulk").onclick = applyTemplateBulk;
            document.getElementById("btn-delete-template").onclick = deleteTemplate;

            // 공통: 불투명도 조절 슬라이더
            document.getElementById("element-opacity").oninput = (e) => {
                if (currentEditingElement) {
                    const val = parseFloat(e.target.value);
                    currentEditingElement.set('opacity', val);
                    document.getElementById("opacity-val").innerText = `${Math.round(val * 100)}%`;
                    canvas.renderAll();
                }
            };

            // 텍스트 서식 리스너들
            document.getElementById("text-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('text', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("fontfamily-editor").onchange = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('fontFamily', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("fontsize-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const vw = parseFloat(e.target.value) || 3.0;
                    const pxSize = (vw / 100) * canvas.getWidth();
                    
                    currentEditingElement.set('fontSize', pxSize);
                    currentEditingElement.originalVwSize = `${vw}vw`;
                    canvas.renderAll();
                }
            };

            document.getElementById("fontcolor-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('fill', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-bold").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isBold = currentEditingElement.fontWeight === 'bold';
                    currentEditingElement.set('fontWeight', isBold ? 'normal' : 'bold');
                    document.getElementById("btn-bold").classList.toggle("active", !isBold);
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-italic").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isItalic = currentEditingElement.fontStyle === 'italic';
                    currentEditingElement.set('fontStyle', isItalic ? 'normal' : 'italic');
                    document.getElementById("btn-italic").classList.toggle("active", !isItalic);
                    canvas.renderAll();
                }
            };

            const setAlign = (align) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('textAlign', align);
                    document.getElementById("btn-align-left").classList.toggle("active", align === 'left');
                    document.getElementById("btn-align-center").classList.toggle("active", align === 'center');
                    document.getElementById("btn-align-right").classList.toggle("active", align === 'right');
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-align-left").onclick = () => setAlign('left');
            document.getElementById("btn-align-center").onclick = () => setAlign('center');
            document.getElementById("btn-align-right").onclick = () => setAlign('right');

            // 도형 서식 리스너들
            document.getElementById("shape-fillcolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('fill', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokecolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('stroke', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokewidth").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('strokeWidth', parseInt(e.target.value) || 0);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-corners").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type === 'rect') {
                    const val = parseInt(e.target.value) || 0;
                    currentEditingElement.set({ rx: val, ry: val });
                    canvas.renderAll();
                }
            };

            // 개체 추가 리스너
            document.getElementById("btn-add-text").onclick = addText;
            document.getElementById("btn-add-rect").onclick = addRect;
            document.getElementById("btn-add-circle").onclick = addCircle;
            document.getElementById("btn-add-triangle").onclick = addTriangle;
            document.getElementById("btn-add-line").onclick = addLine;

            // 레이어 리스너
            document.getElementById("btn-layer-up").onclick = layerUp;
            document.getElementById("btn-layer-down").onclick = layerDown;
            document.getElementById("btn-layer-front").onclick = layerFront;
            document.getElementById("btn-layer-back").onclick = layerBack;

            // 그룹화 / 그룹 해제 리스너
            document.getElementById("btn-group").onclick = groupObjects;
            document.getElementById("btn-ungroup").onclick = ungroupObjects;

            // 삭제 리스너
            document.getElementById("btn-delete").onclick = deleteElement;

            // Delete 키 단축키로 삭제 처리
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' && currentEditingElement) {
                    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') {
                        return;
                    }
                    deleteElement();
                }
            });

            // 저장/취소 리스너
            document.getElementById("btn-save").onclick = saveSlideData;
            document.getElementById("btn-cancel").onclick = cancelEditing;

            // 창 닫을 때 락 자동 반환
            window.onbeforeunload = () => {
                releaseActiveLock();
            };
        };
    </script>
</body>
</html>
