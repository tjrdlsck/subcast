<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Subcast - 실시간 편집기 (Editor)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.3);
            --secondary: #06b6d4;
            --secondary-glow: rgba(6, 182, 212, 0.3);
            --accent-live: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --green-online: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .editor-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-name-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .editor-name-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 120px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-live);
        }

        .status-badge.connected .status-dot {
            background-color: var(--green-online);
            box-shadow: 0 0 10px var(--green-online);
        }

        /* 메인 레이아웃 */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 80px);
        }

        /* 왼쪽: 슬라이드 목록 */
        .slide-panel {
            border-right: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .slide-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .slide-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .slide-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .slide-item.editing {
            border-color: var(--secondary);
            background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 15px var(--secondary-glow);
        }

        .slide-item.editing::before {
            content: 'EDITING';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--secondary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-item.locked {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .slide-item.locked::before {
            content: 'LOCKED';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-live);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-item h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 70px;
        }

        .slide-preview-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lock-owner-text {
            font-size: 0.75rem;
            color: #fb7185;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 오른쪽: 편집기 캔버스 영역 */
        .editor-container {
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 20px;
            overflow-y: auto;
            align-items: center;
        }

        .editor-workspace {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 컨트롤 영역 */
        .editor-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .tool-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-tool:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-save {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-save:hover:not(:disabled) {
            background: #4338ca;
        }

        .btn-cancel {
            background: transparent;
            border-color: transparent;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .text-input-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            width: 300px;
            transition: border-color 0.2s ease;
        }

        .text-input-field:focus {
            border-color: var(--secondary);
        }

        .fontSize-input {
            width: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            text-align: center;
        }

        .fontColor-input {
            width: 50px;
            height: 40px;
            border: 1px solid var(--panel-border);
            background: none;
            cursor: pointer;
            border-radius: 8px;
        }

        /* 잠금 알림 안내 배너 */
        .lock-warning-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            display: none;
            align-items: center;
            gap: 10px;
        }

        /* PPT 스타일 툴바 및 속성 패널 추가 */
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            padding: 10px 15px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--panel-border);
            margin: 0 5px;
        }

        .property-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .property-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .property-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .property-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .select-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* 토글 형태의 버튼들 */
        .btn-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: white;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-toggle:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-toggle.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .btn-toggle:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>Subcast Editor</h1>
        <div class="header-controls">
            <div class="editor-name-group">
                <label for="editor-name">내 이름</label>
                <input type="text" id="editor-name" class="editor-name-input" value="편집자A">
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <!-- 왼쪽: 슬라이드 목록 -->
        <div class="slide-panel">
            <div class="panel-header">슬라이드 리스트</div>
            <div class="slide-list" id="slide-list">
                <!-- 동적 렌더링 -->
            </div>
        </div>

        <!-- 오른쪽: 편집기 캔버스 영역 -->
        <div class="editor-container">
            <div class="editor-workspace">
                <!-- 편집 잠금 상태 알림 배너 -->
                <div class="lock-warning-banner" id="lock-banner">
                    ⚠️ 다른 사용자가 편집 중인 슬라이드입니다.
                </div>

                <div class="editor-card">
                    <h3 style="font-family: 'Outfit'; font-size: 1.2rem; font-weight: 600;" id="editor-title">슬라이드를 선택해주세요.</h3>
                    
                    <!-- 개체 추가 및 레이어 순서 조작 툴바 -->
                    <div class="toolbar">
                        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">개체 추가:</span>
                        <button class="btn-tool" id="btn-add-text" disabled>+ 텍스트</button>
                        <button class="btn-tool" id="btn-add-rect" disabled>+ 사각형</button>
                        <button class="btn-tool" id="btn-add-circle" disabled>+ 원형</button>
                        
                        <div class="toolbar-divider"></div>
                        
                        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">레이어/정렬:</span>
                        <button class="btn-tool" id="btn-layer-up" disabled>앞으로</button>
                        <button class="btn-tool" id="btn-layer-down" disabled>뒤로</button>
                        <button class="btn-tool" id="btn-layer-front" disabled>맨앞으로</button>
                        <button class="btn-tool" id="btn-layer-back" disabled>맨뒤로</button>
                        
                        <div class="toolbar-divider"></div>
                        
                        <button class="btn-tool" id="btn-delete" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #fca5a5;" disabled>선택 삭제</button>
                    </div>

                    <div class="canvas-wrapper">
                        <canvas id="editor-canvas"></canvas>
                    </div>

                    <!-- 상세 속성 편집 패널 -->
                    <div class="property-panel" id="property-panel">
                        <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);" id="property-title">선택된 개체가 없습니다.</div>
                        
                        <!-- 텍스트 전용 속성 -->
                        <div class="property-row" id="text-properties" style="display: none;">
                            <div class="property-group">
                                <label for="text-editor">내용</label>
                                <input type="text" id="text-editor" class="text-input-field" placeholder="텍스트 입력">
                            </div>
                            <div class="property-group">
                                <label for="fontfamily-editor">글꼴</label>
                                <select id="fontfamily-editor" class="select-field">
                                    <option value="Inter">Inter</option>
                                    <option value="Outfit">Outfit</option>
                                    <option value="Arial">Arial</option>
                                    <option value="Georgia">Georgia</option>
                                    <option value="Courier New">Courier New</option>
                                </select>
                            </div>
                            <div class="property-group">
                                <label for="fontsize-editor">크기</label>
                                <input type="number" id="fontsize-editor" class="fontSize-input" value="3" min="0.5" max="20" step="0.1">
                                <span style="font-size: 0.8rem; color: var(--text-muted);">vw</span>
                            </div>
                            <div class="property-group">
                                <label for="fontcolor-editor">글자색</label>
                                <input type="color" id="fontcolor-editor" class="fontColor-input" value="#ffffff">
                            </div>
                            <div class="property-group" style="gap: 4px;">
                                <button class="btn-toggle" id="btn-bold" title="굵게">B</button>
                                <button class="btn-toggle" id="btn-italic" title="기울임">I</button>
                            </div>
                            <div class="property-group" style="gap: 4px;">
                                <button class="btn-toggle" id="btn-align-left" title="왼쪽 정렬">L</button>
                                <button class="btn-toggle" id="btn-align-center" title="가운데 정렬">C</button>
                                <button class="btn-toggle" id="btn-align-right" title="오른쪽 정렬">R</button>
                            </div>
                        </div>

                        <!-- 도형 전용 속성 -->
                        <div class="property-row" id="shape-properties" style="display: none;">
                            <div class="property-group">
                                <label for="shape-fillcolor">채우기 색상</label>
                                <input type="color" id="shape-fillcolor" class="fontColor-input" value="#4f46e5">
                            </div>
                            <div class="property-group">
                                <label for="shape-strokecolor">테두리 색상</label>
                                <input type="color" id="shape-strokecolor" class="fontColor-input" value="#ffffff">
                            </div>
                            <div class="property-group">
                                <label for="shape-strokewidth">테두리 두께</label>
                                <input type="number" id="shape-strokewidth" class="fontSize-input" value="0" min="0" max="20" step="1">
                                <span style="font-size: 0.8rem; color: var(--text-muted);">px</span>
                            </div>
                        </div>
                    </div>

                    <!-- 액션 저장/취소 그룹 -->
                    <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--panel-border); padding-top: 20px;">
                        <button class="btn-tool btn-cancel" id="btn-cancel" disabled>취소</button>
                        <button class="btn-tool btn-save" id="btn-save" disabled>저장 (Apply)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let projectData = null;
        let lockedSlides = {};
        let activeSlideId = null;
        let canvas = null;
        let myEditorId = null; // 웹소켓 세션 ID를 식별하기 위해 수신
        let currentEditingElement = null; // 현재 로컬 편집 중인 요소 레퍼런스

        // 캔버스 초기화
        function initCanvas() {
            canvas = new fabric.Canvas('editor-canvas', {
                width: 768, // 가로 해상도 기본 스케일 설정
                height: 432, // 세로 해상도 (16:9 비율 유지)
                backgroundColor: '#111827'
            });

            // 요소 클릭/선택 시 입력 필드 동기화
            canvas.on('selection:created', onObjectSelected);
            canvas.on('selection:updated', onObjectSelected);
            canvas.on('selection:cleared', onObjectCleared);

            // 로컬 드래그 시 좌표 정보 갱신 (로컬 메모리에만 격리 유지)
            canvas.on('object:moving', onObjectModified);
            canvas.on('object:scaling', onObjectModified);
        }

        // 사용자 닉네임 기본 세팅
        document.getElementById("editor-name").value = `편집자_${Math.floor(Math.random() * 900) + 100}`;

        // 슬라이드 목록 렌더링
        function renderSlides() {
            const listEl = document.getElementById("slide-list");
            listEl.innerHTML = "";

            if (!projectData || !projectData.slides) return;

            projectData.slides.forEach((slide, index) => {
                const item = document.createElement("div");
                item.className = "slide-item";
                item.id = `slide-item-${slide.id}`;

                // 현재 선택해서 편집 중인 슬라이드 표시
                if (slide.id === activeSlideId) {
                    item.classList.add("editing");
                }

                // 다른 사용자가 락을 쥐고 있는지 여부 체크
                const lockOwner = lockedSlides[slide.id];
                const isLockedByOthers = lockOwner !== undefined && lockOwner.ownerId !== myEditorId;
                if (isLockedByOthers) {
                    item.classList.add("locked");
                }

                const textElem = slide.elements.find(e => e.type === 'text');
                const contentText = textElem ? textElem.content : "(요소 없음)";

                item.innerHTML = `
                    <h3>${index + 1}. ${slide.name}</h3>
                    <div class="slide-preview-text">${contentText}</div>
                    ${isLockedByOthers ? `<div class="lock-owner-text">🔒 ${lockOwner.editorName}님이 편집 중</div>` : ''}
                `;

                // 클릭 리스너 (락이 걸리지 않았을 때만 작동)
                if (!isLockedByOthers) {
                    item.onclick = () => selectSlideForEdit(slide.id);
                }

                listEl.appendChild(item);
            });
        }

        // 특정 슬라이드 편집을 위해 선택
        function selectSlideForEdit(slideId) {
            if (activeSlideId === slideId) return;

            // 이미 다른 슬라이드를 편집 중이었다면 언락 메시지 전송
            if (activeSlideId) {
                releaseActiveLock();
            }

            activeSlideId = slideId;
            document.getElementById("editor-title").innerText = `슬라이드 편집: ${projectData.slides.find(s => s.id === slideId).name}`;

            // 서버에 락 요청
            const editorName = document.getElementById("editor-name").value;
            ws.send(JSON.stringify({
                type: "LOCK_SLIDE",
                slideId: slideId,
                editorName: editorName
            }));

            // 로컬 캔버스 로드 및 컨트롤 활성화
            loadSlideToCanvas(slideId);
            setControlsState(true);
            renderSlides();
        }

        // 활성 슬라이드 락 릴리즈
        function releaseActiveLock() {
            if (ws && ws.readyState === WebSocket.OPEN && activeSlideId) {
                ws.send(JSON.stringify({
                    type: "UNLOCK_SLIDE",
                    slideId: activeSlideId
                }));
            }
        }

        // 캔버스에 슬라이드 데이터 로딩
        function loadSlideToCanvas(slideId) {
            canvas.clear();
            const slide = projectData.slides.find(s => s.id === slideId);
            if (!slide) return;

            const canvasWidth = canvas.getWidth();
            const canvasHeight = canvas.getHeight();

            slide.elements.forEach(elem => {
                const x = (elem.x / 100) * canvasWidth;
                const y = (elem.y / 100) * canvasHeight;
                const w = (elem.width / 100) * canvasWidth;
                const h = (elem.height / 100) * canvasHeight;

                if (elem.type === 'text') {
                    // vw -> px 변환
                    let fontSize = 20;
                    if (elem.style?.fontSize) {
                        const match = elem.style.fontSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                        if (match) {
                            fontSize = (parseFloat(match[1]) / 100) * canvasWidth;
                        } else {
                            fontSize = parseInt(elem.style.fontSize) || 20;
                        }
                    }

                    // fabric.Textbox 사용 (줄바꿈 및 직접 더블클릭 편집 가능)
                    const textObj = new fabric.Textbox(elem.content, {
                        left: x,
                        top: y,
                        width: w > 50 ? w : 250,
                        fontSize: fontSize,
                        fill: elem.style?.fontColor || '#ffffff',
                        fontFamily: elem.style?.fontFamily || 'Inter',
                        fontWeight: elem.style?.fontWeight || 'normal',
                        fontStyle: elem.style?.fontStyle || 'normal',
                        textAlign: elem.style?.textAlign || 'left',
                        selectable: true,
                        hasControls: true,
                        originalId: elem.id,
                        originalVwSize: elem.style?.fontSize || "3vw"
                    });

                    canvas.add(textObj);
                } else if (elem.type === 'rect') {
                    const rectObj = new fabric.Rect({
                        left: x,
                        top: y,
                        width: w,
                        height: h,
                        fill: elem.style?.fillColor || '#4f46e5',
                        stroke: elem.style?.strokeColor || 'transparent',
                        strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0,
                        selectable: true,
                        hasControls: true,
                        originalId: elem.id
                    });
                    canvas.add(rectObj);
                } else if (elem.type === 'circle') {
                    const circleObj = new fabric.Circle({
                        left: x,
                        top: y,
                        radius: w / 2 || 30,
                        fill: elem.style?.fillColor || '#06b6d4',
                        stroke: elem.style?.strokeColor || 'transparent',
                        strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0,
                        selectable: true,
                        hasControls: true,
                        originalId: elem.id
                    });
                    canvas.add(circleObj);
                }
            });
            canvas.renderAll();
        }

        // 입력 폼 활성화/비활성화 제어
        function setControlsState(enabled) {
            // 개체 추가 단추
            document.getElementById("btn-add-text").disabled = !enabled;
            document.getElementById("btn-add-rect").disabled = !enabled;
            document.getElementById("btn-add-circle").disabled = !enabled;
            
            // 저장/취소 단추
            document.getElementById("btn-save").disabled = !enabled;
            document.getElementById("btn-cancel").disabled = !enabled;

            if (!enabled) {
                onObjectCleared();
            }
        }

        // 오브젝트 선택 시 이벤트
        function onObjectSelected(e) {
            const activeObj = e.selected ? e.selected[0] : e.target;
            if (!activeObj) return;

            currentEditingElement = activeObj;

            // 삭제 및 레이어 버튼 활성화
            document.getElementById("btn-layer-up").disabled = false;
            document.getElementById("btn-layer-down").disabled = false;
            document.getElementById("btn-layer-front").disabled = false;
            document.getElementById("btn-layer-back").disabled = false;
            document.getElementById("btn-delete").disabled = false;

            const propertyTitle = document.getElementById("property-title");
            const textProps = document.getElementById("text-properties");
            const shapeProps = document.getElementById("shape-properties");

            if (activeObj.type === 'textbox' || activeObj.type === 'text') {
                propertyTitle.innerText = "텍스트 속성 설정";
                textProps.style.display = "flex";
                shapeProps.style.display = "none";

                // 텍스트 속성 값 채우기
                document.getElementById("text-editor").value = activeObj.text || "";
                document.getElementById("fontfamily-editor").value = activeObj.fontFamily || "Inter";
                
                // vw 값 계산
                let vwVal = 3.0;
                if (activeObj.originalVwSize) {
                    const match = activeObj.originalVwSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                    if (match) {
                        vwVal = parseFloat(match[1]);
                    }
                }
                document.getElementById("fontsize-editor").value = vwVal;
                document.getElementById("fontcolor-editor").value = activeObj.fill || "#ffffff";

                // Bold / Italic active 클래스
                document.getElementById("btn-bold").classList.toggle("active", activeObj.fontWeight === 'bold');
                document.getElementById("btn-italic").classList.toggle("active", activeObj.fontStyle === 'italic');

                // Align active 클래스
                document.getElementById("btn-align-left").classList.toggle("active", activeObj.textAlign === 'left');
                document.getElementById("btn-align-center").classList.toggle("active", activeObj.textAlign === 'center');
                document.getElementById("btn-align-right").classList.toggle("active", activeObj.textAlign === 'right');
            } else {
                // rect, circle 등 도형일 경우
                propertyTitle.innerText = `${activeObj.type === 'rect' ? '사각형' : '원형'} 속성 설정`;
                textProps.style.display = "none";
                shapeProps.style.display = "flex";

                document.getElementById("shape-fillcolor").value = activeObj.fill || "#4f46e5";
                document.getElementById("shape-strokecolor").value = activeObj.stroke || "#ffffff";
                document.getElementById("shape-strokewidth").value = activeObj.strokeWidth || 0;
            }
        }

        function onObjectCleared() {
            currentEditingElement = null;
            document.getElementById("property-title").innerText = "선택된 개체가 없습니다.";
            document.getElementById("text-properties").style.display = "none";
            document.getElementById("shape-properties").style.display = "none";

            // 삭제 및 레이어 버튼 비활성화
            document.getElementById("btn-layer-up").disabled = true;
            document.getElementById("btn-layer-down").disabled = true;
            document.getElementById("btn-layer-front").disabled = true;
            document.getElementById("btn-layer-back").disabled = true;
            document.getElementById("btn-delete").disabled = true;
        }

        // 로컬 캔버스 이동/스케일 시 데이터 업데이트 (메모리 격리)
        function onObjectModified(e) {
            const activeObj = e.target;
            if (!activeObj) return;

            if (activeObj.type === 'textbox' || activeObj.type === 'text') {
                // 사이즈나 크기 수정 시 vw 값을 실시간 재계산해서 저장할 수 있도록 캐싱
                const canvasWidth = canvas.getWidth();
                const currentFontSize = activeObj.fontSize * (activeObj.scaleX || 1);
                const newVwSize = `${((currentFontSize / canvasWidth) * 100).toFixed(2)}vw`;
                activeObj.originalVwSize = newVwSize;
            }
        }

        // 취소 처리
        function cancelEditing() {
            if (activeSlideId) {
                loadSlideToCanvas(activeSlideId);
            }
        }

        // 개체 추가 함수
        function addText() {
            if (!activeSlideId) return;
            const textObj = new fabric.Textbox("텍스트를 입력하세요", {
                left: 100,
                top: 100,
                width: 250,
                fontSize: (3 / 100) * canvas.getWidth(), // 기본 3vw
                fill: '#ffffff',
                fontFamily: 'Inter',
                selectable: true,
                hasControls: true,
                originalId: `elem_${Math.random().toString(36).substr(2, 9)}`,
                originalVwSize: "3vw"
            });
            canvas.add(textObj);
            canvas.setActiveObject(textObj);
            canvas.renderAll();
        }

        function addRect() {
            if (!activeSlideId) return;
            const rectObj = new fabric.Rect({
                left: 150,
                top: 150,
                width: 150,
                height: 100,
                fill: '#4f46e5',
                stroke: 'transparent',
                strokeWidth: 0,
                selectable: true,
                hasControls: true,
                originalId: `elem_${Math.random().toString(36).substr(2, 9)}`
            });
            canvas.add(rectObj);
            canvas.setActiveObject(rectObj);
            canvas.renderAll();
        }

        function addCircle() {
            if (!activeSlideId) return;
            const circleObj = new fabric.Circle({
                left: 150,
                top: 150,
                radius: 60,
                fill: '#06b6d4',
                stroke: 'transparent',
                strokeWidth: 0,
                selectable: true,
                hasControls: true,
                originalId: `elem_${Math.random().toString(36).substr(2, 9)}`
            });
            canvas.add(circleObj);
            canvas.setActiveObject(circleObj);
            canvas.renderAll();
        }

        // 레이어 순서 조작 함수
        function layerUp() {
            if (currentEditingElement) {
                canvas.bringForward(currentEditingElement);
                canvas.renderAll();
            }
        }

        function layerDown() {
            if (currentEditingElement) {
                canvas.sendBackwards(currentEditingElement);
                canvas.renderAll();
            }
        }

        function layerFront() {
            if (currentEditingElement) {
                canvas.bringToFront(currentEditingElement);
                canvas.renderAll();
            }
        }

        function layerBack() {
            if (currentEditingElement) {
                canvas.sendToBack(currentEditingElement);
                canvas.renderAll();
            }
        }

        // 개체 삭제 함수
        function deleteElement() {
            if (currentEditingElement) {
                canvas.remove(currentEditingElement);
                canvas.discardActiveObject();
                onObjectCleared();
                canvas.renderAll();
            }
        }

        // 최종 데이터 패킷 서버 전송 (저장 및 Apply)
        function saveSlideData() {
            if (!activeSlideId || !projectData) return;

            const slide = projectData.slides.find(s => s.id === activeSlideId);
            if (!slide) return;

            const canvasWidth = canvas.getWidth();
            const canvasHeight = canvas.getHeight();

            // 캔버스의 모든 객체를 백분율 형태 스키마로 변환하여 취합
            const elements = [];
            canvas.getObjects().forEach(obj => {
                const xPct = (obj.left / canvasWidth) * 100;
                const yPct = (obj.top / canvasHeight) * 100;
                
                let wPct = 0;
                let hPct = 0;

                if (obj.type === 'circle') {
                    const radius = obj.radius * (obj.scaleX || 1);
                    wPct = ((radius * 2) / canvasWidth) * 100;
                    hPct = ((radius * 2) / canvasHeight) * 100;
                } else {
                    wPct = ((obj.width * obj.scaleX) / canvasWidth) * 100;
                    hPct = ((obj.height * obj.scaleY) / canvasHeight) * 100;
                }

                const type = (obj.type === 'textbox' || obj.type === 'text') ? 'text' : obj.type;
                const style = {};

                if (type === 'text') {
                    style.fontSize = obj.originalVwSize || "3vw";
                    style.fontColor = obj.fill;
                    style.fontFamily = obj.fontFamily || "Inter";
                    style.fontWeight = obj.fontWeight || "normal";
                    style.fontStyle = obj.fontStyle || "normal";
                    style.textAlign = obj.textAlign || "left";
                } else {
                    style.fillColor = obj.fill;
                    style.strokeColor = obj.stroke || "transparent";
                    style.strokeWidth = obj.strokeWidth || 0;
                }

                elements.push({
                    id: obj.originalId || `elem_${Math.random().toString(36).substr(2, 9)}`,
                    type: type,
                    content: type === 'text' ? (obj.text || "") : "",
                    x: parseFloat(xPct.toFixed(2)),
                    y: parseFloat(yPct.toFixed(2)),
                    width: parseFloat(wPct.toFixed(2)),
                    height: parseFloat(hPct.toFixed(2)),
                    style: style
                });
            });

            const updatedSlide = {
                id: slide.id,
                name: slide.name,
                elements: elements
            };

            // 서버에 SAVE_SLIDE 발송 (백엔드가 뷰어 실시간 송출 갱신 여부를 판별함)
            ws.send(JSON.stringify({
                type: "SAVE_SLIDE",
                slide: updatedSlide
            }));

            // 로컬 데이터 선 갱신
            const idx = projectData.slides.findIndex(s => s.id === activeSlideId);
            if (idx !== -1) {
                projectData.slides[idx] = updatedSlide;
            }

            // 락 유지하고 저장 성공 얼럿
            alert("슬라이드가 저장 및 동기화되었습니다.");
            renderSlides();
        }

        // 웹소켓 연결
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=editor`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.add("connected");
                document.getElementById("status-text").innerText = "Connected (Editor)";
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'INITIAL_SYNC') {
                    projectData = message.data;
                    
                    // 락 정보 빌드 (slideId -> {ownerId, editorName})
                    lockedSlides = {};
                    for (const [slideId, wsSessionId] of Object.entries(message.lockedSlides || {})) {
                        lockedSlides[slideId] = {
                            ownerId: wsSessionId,
                            editorName: "다른 편집자"
                        };
                    }
                    
                    renderSlides();
                }
                else if (message.type === 'SLIDE_LOCKED') {
                    lockedSlides[message.slideId] = {
                        ownerId: message.ownerId,
                        editorName: message.editorName
                    };
                    
                    // 만약 본인이 락을 획득한 슬라이드인 경우
                    if (message.slideId === activeSlideId) {
                        myEditorId = message.ownerId; // 내 고유 세션 ID 할당
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UNLOCKED') {
                    delete lockedSlides[message.slideId];
                    renderSlides();
                }
                else if (message.type === 'LOCK_FAILED') {
                    alert(`잠금 획득 실패: ${message.reason}`);
                    if (activeSlideId === message.slideId) {
                        activeSlideId = null;
                        canvas.clear();
                        setControlsState(false);
                        document.getElementById("editor-title").innerText = "슬라이드를 선택해주세요.";
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UPDATED') {
                    // 타 편집기나 저장소에서 슬라이드가 변경된 경우 local 데이터 갱신
                    if (projectData) {
                        const idx = projectData.slides.findIndex(s => s.id === message.slideId);
                        if (idx !== -1) {
                            projectData.slides[idx] = message.slide;
                        } else {
                            projectData.slides.push(message.slide);
                        }
                        
                        // 현재 내 편집 뷰어 화면에 반영되어야 하고, 내가 락을 갖고 있지 않다면 리로드
                        if (activeSlideId === message.slideId && lockedSlides[activeSlideId]?.ownerId !== myEditorId) {
                            loadSlideToCanvas(activeSlideId);
                        }
                        renderSlides();
                    }
                }
            };

            ws.onclose = () => {
                const badge = document.getElementById("status-badge");
                badge.classList.remove("connected");
                document.getElementById("status-text").innerText = "Disconnected";
                setTimeout(connectWebSocket, 3000);
            };
        }

        window.onload = () => {
            initCanvas();
            connectWebSocket();

            // 텍스트 내용 편집
            document.getElementById("text-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('text', e.target.value);
                    canvas.renderAll();
                }
            };

            // 글꼴 변경
            document.getElementById("fontfamily-editor").onchange = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('fontFamily', e.target.value);
                    canvas.renderAll();
                }
            };

            // 폰트 크기 변경
            document.getElementById("fontsize-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const vw = parseFloat(e.target.value) || 3.0;
                    const pxSize = (vw / 100) * canvas.getWidth();
                    
                    currentEditingElement.set('fontSize', pxSize);
                    currentEditingElement.originalVwSize = `${vw}vw`;
                    canvas.renderAll();
                }
            };

            // 폰트 색상 변경
            document.getElementById("fontcolor-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('fill', e.target.value);
                    canvas.renderAll();
                }
            };

            // Bold / Italic / Align 토글 핸들러
            document.getElementById("btn-bold").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isBold = currentEditingElement.fontWeight === 'bold';
                    currentEditingElement.set('fontWeight', isBold ? 'normal' : 'bold');
                    document.getElementById("btn-bold").classList.toggle("active", !isBold);
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-italic").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isItalic = currentEditingElement.fontStyle === 'italic';
                    currentEditingElement.set('fontStyle', isItalic ? 'normal' : 'italic');
                    document.getElementById("btn-italic").classList.toggle("active", !isItalic);
                    canvas.renderAll();
                }
            };

            const setAlign = (align) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('textAlign', align);
                    document.getElementById("btn-align-left").classList.toggle("active", align === 'left');
                    document.getElementById("btn-align-center").classList.toggle("active", align === 'center');
                    document.getElementById("btn-align-right").classList.toggle("active", align === 'right');
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-align-left").onclick = () => setAlign('left');
            document.getElementById("btn-align-center").onclick = () => setAlign('center');
            document.getElementById("btn-align-right").onclick = () => setAlign('right');

            // 도형 속성 리스너
            document.getElementById("shape-fillcolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('fill', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokecolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('stroke', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokewidth").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('strokeWidth', parseInt(e.target.value) || 0);
                    canvas.renderAll();
                }
            };

            // 개체 추가 리스너
            document.getElementById("btn-add-text").onclick = addText;
            document.getElementById("btn-add-rect").onclick = addRect;
            document.getElementById("btn-add-circle").onclick = addCircle;

            // 레이어 리스너
            document.getElementById("btn-layer-up").onclick = layerUp;
            document.getElementById("btn-layer-down").onclick = layerDown;
            document.getElementById("btn-layer-front").onclick = layerFront;
            document.getElementById("btn-layer-back").onclick = layerBack;

            // 삭제 리스너
            document.getElementById("btn-delete").onclick = deleteElement;

            // Delete 키 단축키로 삭제 처리
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' && currentEditingElement) {
                    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') {
                        return;
                    }
                    deleteElement();
                }
            });

            // 저장/취소 리스너
            document.getElementById("btn-save").onclick = saveSlideData;
            document.getElementById("btn-cancel").onclick = cancelEditing;

            // 창 닫을 때 락 자동 반환
            window.onbeforeunload = () => {
                releaseActiveLock();
            };
        };
    </script>
</body>
</html>
