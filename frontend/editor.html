<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Subcast - 실시간 편집기 (Editor)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --panel-bg: #1f2937;
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(20px);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent-live: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dark: #111827;
            --green-online: #10b981;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(239, 68, 68, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. Top Bar (상단 바) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            padding: 0 24px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: var(--panel-blur);
            border-bottom: 1px solid var(--panel-border);
            z-index: 100;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-fill-color: transparent;
            -webkit-text-fill-color: transparent;
        }
        
        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-center h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--panel-border);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .editor-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .editor-name-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .editor-name-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: white;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            width: 110px;
        }
        
        .editor-name-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-live);
        }
        
        .status-badge.connected .status-dot {
            background-color: var(--green-online);
            box-shadow: 0 0 6px var(--green-online);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header-action {
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .btn-header-action.btn-save {
            background: var(--primary);
            color: white;
        }
        .btn-header-action.btn-save:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px var(--primary-glow);
            transform: translateY(-1px);
        }
        .btn-header-action.btn-save:disabled,
        .btn-header-action.btn-cancel:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .btn-header-action.btn-cancel {
            background: transparent;
            border-color: var(--panel-border);
            color: var(--text-main);
        }
        .btn-header-action.btn-cancel:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        /* 2. Main Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            height: calc(100vh - 56px);
        }

        /* Left Navigation Sidebar (아이콘 세로 탭) */
        .left-nav-sidebar {
            width: 72px;
            background: #0f131f;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 12px;
            flex-shrink: 0;
        }

        .nav-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .nav-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }
        
        .nav-tab-btn.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .nav-tab-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: transform 0.2s ease;
        }
        .nav-tab-btn:hover svg {
            transform: scale(1.05);
        }
        .nav-tab-btn.active svg {
            stroke: white;
        }

        /* Left Sub Panel (드로어 패널) */
        .left-sub-panel {
            width: 280px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: var(--panel-blur);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        
        .sidebar-panel.active {
            display: flex;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 슬라이드 목록 스타일 */
        .slide-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slide-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: var(--shadow-sm);
        }
        
        .slide-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        
        .slide-item.editing {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
        }
        
        .slide-item.locked {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .slide-item.editing::before, .slide-item.locked::before {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 5;
        }
        
        .slide-item.editing::before {
            content: 'EDITING';
            background: var(--primary);
            color: white;
        }
        
        .slide-item.locked::before {
            content: 'LOCKED';
            background: var(--accent-live);
            color: white;
        }

        .slide-item-checkbox {
            accent-color: var(--primary);
        }

        .slide-thumbnail-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #090d16;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }
        
        .slide-thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lock-owner-text {
            font-size: 0.7rem;
            color: #f87171;
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 템플릿 패널 스타일 */
        .template-actions {
            margin-bottom: 16px;
        }
        
        .btn-template-action {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            color: white;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-template-action:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-template-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .template-selector-group {
            margin-top: 20px;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .template-selector-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .select-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
            transition: all 0.2s;
        }
        
        .select-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }
        
        .template-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        
        .template-buttons .btn-apply {
            flex: 1;
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .template-buttons .btn-apply:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.25);
        }
        
        .template-buttons .btn-delete-tpl {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px 14px;
        }
        .template-buttons .btn-delete-tpl:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.2);
        }

        /* 텍스트 삽입 패널 스타일 */
        .text-templates-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn-add-text-tpl {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .btn-add-text-tpl:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: scale(1.01);
        }
        .btn-add-text-tpl:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-add-text-tpl.tpl-title {
            padding: 18px 16px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }
        .btn-add-text-tpl.tpl-subtitle {
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .btn-add-text-tpl.tpl-body {
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 도형/선 삽입 패널 스타일 */
        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .btn-shape-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: white;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .btn-shape-item:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .btn-shape-item:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .shape-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        /* 3. Center Canvas Workspace (중앙 캔버스 영역) */
        .canvas-workspace {
            flex: 1;
            background-color: #0f131f;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .lock-warning-banner {
            background: rgba(239, 68, 68, 0.15);
            border-bottom: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 10px 20px;
            font-size: 0.82rem;
            font-weight: 600;
            width: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .canvas-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
            position: relative;
        }

        .canvas-wrapper-outer {
            background: #090d16;
            padding: 6px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s;
        }
        
        .canvas-wrapper-outer:focus-within {
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }

        .canvas-wrapper {
            width: 768px;
            height: 432px;
            background: #111827;
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        /* 캔버스 하단 바 */
        .canvas-bottom-bar {
            height: 38px;
            background: rgba(17, 24, 39, 0.9);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* 4. Right Inspector Panel (우측 속성 패널) */
        .right-inspector-panel {
            width: 300px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: var(--panel-blur);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .right-inspector-panel .panel-header {
            border-bottom: 1px solid var(--panel-border);
            padding: 20px;
        }

        .inspector-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inspector-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 16px;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .inspector-empty p {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .inspector-section {
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 20px;
        }
        
        .inspector-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .property-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .property-row:last-child {
            margin-bottom: 0;
        }

        .property-row.inline {
            flex-direction: row;
            gap: 12px;
        }
        
        .property-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .property-row label, .property-col label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .text-area-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: white;
            font-size: 0.8rem;
            resize: none;
            height: 60px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .text-area-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .fontSize-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: white;
            font-size: 0.8rem;
            outline: none;
            width: 100%;
            transition: all 0.2s;
        }
        
        .fontSize-input:focus {
            border-color: var(--primary);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 4px 10px;
        }

        .fontColor-input {
            width: 24px;
            height: 24px;
            padding: 0;
            border: 1px solid var(--panel-border);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            overflow: hidden;
            outline: none;
            flex-shrink: 0;
        }
        
        .fontColor-input::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        .fontColor-input::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }
        
        .color-hex-val {
            font-size: 0.8rem;
            color: var(--text-main);
            font-family: 'Outfit', monospace;
        }

        .btn-group-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 2px;
            gap: 2px;
        }

        .btn-toggle {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-toggle:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
        
        .btn-toggle.active {
            background: var(--primary);
            color: white;
        }
        .btn-toggle:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-group-toggle .divider {
            width: 1px;
            background: var(--panel-border);
            margin: 4px 2px;
        }

        /* 공통 인스펙터 속성 */
        .opacity-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .opacity-control label {
            display: flex;
            justify-content: space-between;
        }
        
        .opacity-control input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .arrange-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .arrange-grid .ribbon-action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            color: white;
            padding: 8px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .arrange-grid .ribbon-action-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }
        .arrange-grid .ribbon-action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-group-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            color: white;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .btn-group-action:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-group-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-delete-element {
            width: 100%;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;

            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }
        .btn-delete-element:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Top Bar -->

            <h1>
                <svg style="width: 22px; height: 22px; fill: var(--primary);" viewBox="0 0 24 24">

                <div class="header-actions">

                    <button class="btn-header-action btn-save" id="btn-save" disabled>저장 (Apply)</button>

        </header>

        <!-- Main Workspace Area -->

                <button class="nav-tab-btn" data-target="panel-templates" onclick="switchLeftTab('panel-templates')">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>

                    </svg>
                    <span>템플릿</span>
                </button>
                <button class="nav-tab-btn" data-target="panel-text" onclick="switchLeftTab('panel-text')">
                    <svg viewBox="0 0 24 24">
                        <polyline points="4 7 4 4 20 4 20 7"/>

                        <line x1="12" y1="4" x2="12" y2="20"/>

                    <span>텍스트</span>
                </button>
                <button class="nav-tab-btn" data-target="panel-shapes" onclick="switchLeftTab('panel-shapes')">

            </aside>

            <!-- Left Sub Panel (드로어 패널) -->
            <aside class="left-sub-panel">
                <!-- 1) 슬라이드 리스트 탭 -->
                <div class="sidebar-panel active" id="panel-slides">
                    <div class="panel-header">
                        <h3>슬라이드 목록</h3>
                        <button class="btn-template-action" id="btn-add-slide" style="width: auto; padding: 6px 12px; font-size: 0.78rem; background: var(--primary); border-color: var(--primary);">+ 새 슬라이드</button>
                    </div>
                    <div class="panel-body">
                        <div class="slide-list" id="slide-list">
                            <!-- 동적 렌더링 -->
                        </div>
                    </div>
                </div>

                <!-- 2) 템플릿 탭 -->
                <div class="sidebar-panel" id="panel-templates">
                    <div class="panel-header">
                        <h3>디자인 템플릿</h3>
                    </div>
                    <div class="panel-body">
                        <div class="template-actions">
                            <button class="btn-template-action" id="btn-save-template" disabled>

                <!-- 3) 텍스트 탭 -->
                <div class="sidebar-panel" id="panel-text">

            <!-- Center Canvas Workspace -->

                    <!-- 텍스트 속성 설정 섹션 -->

                        <h4 class="section-title">텍스트 서식</h4>

                            <textarea id="text-editor" class="text-area-field" placeholder="텍스트를 입력해 주세요." disabled></textarea>

                                    <option value="Inter">Inter</option>

                    <!-- 공통 속성 설정 섹션 -->
                    <div class="inspector-section" id="inspector-common-section" style="display: none;">

    </div>

    <script>
        // CanvasTextBaseline 패치: 브라우저 확장 프로그램 등에서 'alphabetical'을 넣어 발생하는 경고 우회
        (function() {
            if (typeof CanvasRenderingContext2D !== 'undefined') {
                const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
                if (descriptor && descriptor.set) {
                    const originalSet = descriptor.set;
                    Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
                        set: function(value) {
                            if (value === 'alphabetical') {
                                value = 'alphabetic';
                            }
                            originalSet.call(this, value);
                        },
                        get: descriptor.get,
                        enumerable: descriptor.enumerable,
                        configurable: descriptor.configurable
                    });
                }
            }
        })();

        let ws = null;
        let projectData = null;
        let lockedSlides = {};
        let activeSlideId = null;
        let canvas = null;
        let myEditorId = null;
        let currentEditingElement = null;

        // 백그라운드에서 썸네일을 자동 생성하는 함수
        function autoGenerateThumbnail(slide) {
            if (slide.thumbnail) return Promise.resolve(slide.thumbnail);
            
            return new Promise((resolve) => {
                const tempCanvasEl = document.createElement('canvas');
                tempCanvasEl.width = 768;
                tempCanvasEl.height = 432;
                
                const tempCanvas = new fabric.StaticCanvas(tempCanvasEl, {
                    backgroundColor: '#111827'
                });
                
                slide.elements.forEach(elem => {
                    const obj = deserializeElement(elem, 768, 432);
                    if (obj) tempCanvas.add(obj);
                });
                
                tempCanvas.renderAll();
                
                const dataUrl = tempCanvas.toDataURL({
                    format: 'jpeg',
                    quality: 0.4
                });
                
                tempCanvas.dispose();
                slide.thumbnail = dataUrl;
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "SAVE_SLIDE",
                        slide: slide
                    }));
                }
                
                resolve(dataUrl);
            });
        }

        // 왼쪽 탭 메뉴 전환
        function switchLeftTab(tabId) {
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-target') === tabId);
            });
            document.querySelectorAll('.sidebar-panel').forEach(panel => {
                panel.classList.toggle('active', panel.id === tabId);
            });
        }

        function initCanvas() {
            canvas = new fabric.Canvas('editor-canvas', {
                width: 768,
                height: 432,
                backgroundColor: '#111827',
                preserveObjectStacking: true
            });
            canvas.on('selection:created', onObjectSelected);
            canvas.on('selection:updated', onObjectSelected);
            canvas.on('selection:cleared', onObjectCleared);
            canvas.on('object:moving', onObjectModified);
            canvas.on('object:scaling', onObjectModified);
        }

        let lastCheckedIndex = -1;

        function handleCheckboxClick(e, index) {
            e.stopPropagation();
            const checkboxes = document.querySelectorAll(".slide-select-checkbox");
            
            if (e.shiftKey && lastCheckedIndex !== -1) {
                const start = Math.min(index, lastCheckedIndex);
                const end = Math.max(index, lastCheckedIndex);
                const targetState = e.target.checked;
                
                for (let i = start; i <= end; i++) {
                    checkboxes[i].checked = targetState;
                }
            }
            lastCheckedIndex = index;
        }

        function renderSlides() {
            const listEl = document.getElementById("slide-list");
            listEl.innerHTML = "";
            if (!projectData || !projectData.slides) return;
            projectData.slides.forEach((slide, index) => {
                const item = document.createElement("div");
                item.className = "slide-item";
                item.id = `slide-item-${slide.id}`;
                if (slide.id === activeSlideId) item.classList.add("editing");
                const lockOwner = lockedSlides[slide.id];
                const isLockedByOthers = lockOwner !== undefined && lockOwner.ownerId !== myEditorId;
                if (isLockedByOthers) item.classList.add("locked");
                
                item.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <input type="checkbox" class="slide-select-checkbox" data-slide-id="${slide.id}" style="width:16px; height:16px; cursor:pointer; flex-shrink: 0; margin-top: 2px; z-index: 10; position: relative;" onclick="handleCheckboxClick(event, ${index})">
                        <div style="flex: 1; min-width: 0;">
                            <h3 style="margin: 0 0 4px 0; font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 20px;">${index + 1}. ${slide.name}</h3>
                            <div class="slide-thumbnail-wrapper">
                                ${slide.thumbnail ? `<img src="${slide.thumbnail}">` : `<span style="font-size: 0.7rem; color: var(--text-muted);">미리보기 없음</span>`}
                            </div>
                            ${isLockedByOthers ? `<div class="lock-owner-text">🔒 ${lockOwner.editorName}님이 편집 중</div>` : ''}
                        </div>
                    </div>
                `;
                if (!isLockedByOthers) item.onclick = () => selectSlideForEdit(slide.id);
                listEl.appendChild(item);
            });
        }

        function selectSlideForEdit(slideId) {
            if (activeSlideId === slideId) return;
            if (activeSlideId) releaseActiveLock();
            activeSlideId = slideId;
            document.getElementById("editor-title").innerText = `슬라이드 편집: ${projectData.slides.find(s => s.id === slideId).name}`;
            const editorName = document.getElementById("editor-name").value;
            ws.send(JSON.stringify({ type: "LOCK_SLIDE", slideId: slideId, editorName: editorName }));
            loadSlideToCanvas(slideId);
            setControlsState(true);
            renderSlides();
        }

        function releaseActiveLock() {
            if (ws && ws.readyState === WebSocket.OPEN && activeSlideId) {
                ws.send(JSON.stringify({ type: "UNLOCK_SLIDE", slideId: activeSlideId }));
            }
        }

        function deserializeElement(elem, canvasWidth, canvasHeight, isInsideGroup = false, groupW = 1, groupH = 1) {
            let x, y, w, h;
            if (isInsideGroup) {
                x = (elem.x / 100) * groupW;
                y = (elem.y / 100) * groupH;
                w = (elem.width / 100) * groupW;
                h = (elem.height / 100) * groupH;
            } else {
                x = (elem.x / 100) * canvasWidth;
                y = (elem.y / 100) * canvasHeight;
                w = (elem.width / 100) * canvasWidth;
                h = (elem.height / 100) * canvasHeight;
            }
            let obj = null;
            const opacity = elem.style?.opacity !== undefined ? elem.style.opacity : 1.0;
            if (elem.type === 'text') {
                let fontSize = 20;
                if (elem.style?.fontSize) {
                    const match = elem.style.fontSize.match(/^(\d+(?:\.\d+)?)\s*vw$/);
                    fontSize = match ? (parseFloat(match[1]) / 100) * (isInsideGroup ? groupW : canvasWidth) : parseInt(elem.style.fontSize) || 20;
                }
                const textOptions = { left: x, top: y, width: w > 50 ? w : 250, fontSize: fontSize, fill: elem.style?.fontColor || '#ffffff', fontFamily: elem.style?.fontFamily || 'Inter', fontWeight: elem.style?.fontWeight || 'normal', fontStyle: elem.style?.fontStyle || 'normal', textAlign: elem.style?.textAlign || 'left', opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id, originalVwSize: elem.style?.fontSize || "3vw" };
                obj = isInsideGroup ? new fabric.Text(elem.content, textOptions) : new fabric.Textbox(elem.content, textOptions);
            } else if (elem.type === 'rect') {
                obj = new fabric.Rect({ left: x, top: y, width: w, height: h, rx: elem.style?.cornerRadius || 0, ry: elem.style?.cornerRadius || 0, fill: elem.style?.fillColor || '#4f46e5', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'circle') {
                obj = new fabric.Circle({ left: x, top: y, radius: w / 2 || 30, fill: elem.style?.fillColor || '#06b6d4', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'triangle') {
                obj = new fabric.Triangle({ left: x, top: y, width: w, height: h, fill: elem.style?.fillColor || '#10b981', stroke: elem.style?.strokeColor || 'transparent', strokeWidth: elem.style?.strokeWidth !== undefined ? elem.style.strokeWidth : 0, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'line') {
                obj = new fabric.Line([x, y, x + w, y], { stroke: elem.style?.fillColor || elem.style?.strokeColor || '#f59e0b', strokeWidth: elem.style?.strokeWidth !== undefined && elem.style?.strokeWidth > 0 ? elem.style.strokeWidth : 4, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            } else if (elem.type === 'group' && elem.children) {
                const members = elem.children.map(child => deserializeElement(child, canvasWidth, canvasHeight, true, w, h));
                obj = new fabric.Group(members, { left: x, top: y, opacity: opacity, selectable: !isInsideGroup, hasControls: !isInsideGroup, originalId: elem.id });
            }
            return obj;
        }

        function serializeElement(obj, canvasWidth, canvasHeight, isInsideGroup = false, groupW = 1, groupH = 1) {
            let xPct, yPct, wPct, hPct;
            if (isInsideGroup) {
                xPct = (obj.left / groupW) * 100;
                yPct = (obj.top / groupH) * 100;
                wPct = ((obj.width * obj.scaleX) / groupW) * 100;
                hPct = ((obj.height * obj.scaleY) / groupH) * 100;
            } else {
                xPct = (obj.left / canvasWidth) * 100;
                yPct = (obj.top / canvasHeight) * 100;
                wPct = obj.type === 'circle' ? (((obj.radius * (obj.scaleX || 1)) * 2) / canvasWidth) * 100 : ((obj.width * obj.scaleX) / canvasWidth) * 100;
                hPct = obj.type === 'circle' ? (((obj.radius * (obj.scaleY || 1)) * 2) / canvasHeight) * 100 : ((obj.height * obj.scaleY) / canvasHeight) * 100;
            }
            const type = (obj.type === 'textbox' || obj.type === 'text') ? 'text' : obj.type;
            const style = { opacity: obj.opacity !== undefined ? parseFloat(obj.opacity.toFixed(2)) : 1.0 };
            if (type === 'text') {
                style.fontSize = obj.originalVwSize || "3vw";
                style.fontColor = obj.fill;
                style.fontFamily = obj.fontFamily || "Inter";
                style.fontWeight = obj.fontWeight || "normal";
                style.fontStyle = obj.fontStyle || "normal";
                style.textAlign = obj.textAlign || "left";
            } else if (['rect', 'circle', 'triangle', 'line'].includes(type)) {
                style.fillColor = obj.fill || "transparent";
                style.strokeColor = obj.stroke || "transparent";
                style.strokeWidth = obj.strokeWidth || 0;
                if (type === 'rect') style.cornerRadius = obj.rx || 0;
            }
            const elementData = { id: obj.originalId || `elem_${Math.random().toString(36).substr(2, 9)}`, type: type, content: type === 'text' ? (obj.text || "") : "", x: parseFloat(xPct.toFixed(2)), y: parseFloat(yPct.toFixed(2)), width: parseFloat(wPct.toFixed(2)), height: parseFloat(hPct.toFixed(2)), style: style };
            if (type === 'group') {
                elementData.children = obj.getObjects().map(child => serializeElement(child, canvasWidth, canvasHeight, true, obj.width * obj.scaleX, obj.height * obj.scaleY));
            }
            return elementData;
        }

        function loadSlideToCanvas(slideId) {
            canvas.clear();
            const slide = projectData.slides.find(s => s.id === slideId);
            if (!slide) return;
            slide.elements.forEach(elem => {
                const obj = deserializeElement(elem, canvas.getWidth(), canvas.getHeight());
                if (obj) canvas.add(obj);
            });
            canvas.renderAll();
        }

        function setControlsState(enabled) {
            ['btn-add-text-title', 'btn-add-text-subtitle', 'btn-add-text-body', 'btn-add-rect', 'btn-add-circle', 'btn-add-triangle', 'btn-add-line', 'btn-save', 'btn-cancel', 'btn-save-template', 'select-templates', 'btn-apply-template-bulk', 'btn-delete-template'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !enabled;
            });
            if (!enabled) onObjectCleared();
        }

        function onObjectSelected(e) {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;
            currentEditingElement = activeObj;

            // Z-Index 배치, 삭제 버튼 활성화
            ['btn-layer-up', 'btn-layer-down', 'btn-layer-front', 'btn-layer-back', 'btn-delete'].forEach(id => document.getElementById(id).disabled = false);
            
            // 공통 속성 활성화
            const opacitySlider = document.getElementById("element-opacity");
            opacitySlider.disabled = false;
            opacitySlider.value = activeObj.opacity !== undefined ? activeObj.opacity : 1;
            document.getElementById("opacity-val").innerText = `${Math.round(opacitySlider.value * 100)}%`;
            
            document.getElementById("btn-group").disabled = activeObj.type !== 'activeSelection';
            document.getElementById("btn-ungroup").disabled = activeObj.type !== 'group';
            document.getElementById("selection-status-bar").innerText = `선택된 개체: ${activeObj.type} (${activeObj.originalId || '신규'})`;

            // 인스펙터 화면 처리
            document.getElementById("inspector-empty").style.display = "none";
            document.getElementById("inspector-common-section").style.display = "block";

            const textSection = document.getElementById("inspector-text-section");
            const shapeSection = document.getElementById("inspector-shape-section");

            if (activeObj.type === 'textbox' || activeObj.type === 'text') {
                textSection.style.display = "block";
                shapeSection.style.display = "none";

                ['text-editor', 'fontfamily-editor', 'fontsize-editor', 'fontcolor-editor', 'btn-bold', 'btn-italic', 'btn-align-left', 'btn-align-center', 'btn-align-right'].forEach(id => document.getElementById(id).disabled = false);
                document.getElementById("text-editor").value = activeObj.text || "";
                document.getElementById("fontsize-editor").value = parseFloat(activeObj.originalVwSize) || 3.0;
                
                const fontColor = activeObj.fill || "#ffffff";
                document.getElementById("fontcolor-editor").value = fontColor;
                document.getElementById("fontcolor-hex").innerText = fontColor.toUpperCase();

                // 텍스트 정렬 상태 표시
                const align = activeObj.textAlign || 'left';
                document.getElementById("btn-align-left").classList.toggle("active", align === 'left');
                document.getElementById("btn-align-center").classList.toggle("active", align === 'center');
                document.getElementById("btn-align-right").classList.toggle("active", align === 'right');
                
                // 볼드/이탤릭 상태 표시
                document.getElementById("btn-bold").classList.toggle("active", activeObj.fontWeight === 'bold');
                document.getElementById("btn-italic").classList.toggle("active", activeObj.fontStyle === 'italic');

            } else if (['rect', 'circle', 'triangle', 'line'].includes(activeObj.type)) {
                textSection.style.display = "none";
                shapeSection.style.display = "block";

                ['shape-fillcolor', 'shape-strokecolor', 'shape-strokewidth'].forEach(id => document.getElementById(id).disabled = false);
                
                const fillColor = activeObj.fill || "#4f46e5";
                document.getElementById("shape-fillcolor").value = fillColor;
                document.getElementById("shape-fillcolor-hex").innerText = fillColor.toUpperCase();

                const strokeColor = activeObj.stroke || "#ffffff";
                document.getElementById("shape-strokecolor").value = strokeColor;
                document.getElementById("shape-strokecolor-hex").innerText = strokeColor.toUpperCase();

                document.getElementById("shape-strokewidth").value = activeObj.strokeWidth || 0;

                const cornerInput = document.getElementById("shape-corners");
                cornerInput.disabled = activeObj.type !== 'rect';
                if (activeObj.type === 'rect') {
                    document.getElementById("corner-rounding-group").style.opacity = "1";
                    cornerInput.value = activeObj.rx || 0;
                } else {
                    document.getElementById("corner-rounding-group").style.opacity = "0.4";
                    cornerInput.value = 0;
                }
            } else {
                // 그룹 등 기타 개체
                textSection.style.display = "none";
                shapeSection.style.display = "none";
            }
        }

        function onObjectCleared() {
            currentEditingElement = null;
            document.getElementById("selection-status-bar").innerText = "선택된 개체가 없습니다.";
            
            // 인스펙터 화면 처리
            document.getElementById("inspector-empty").style.display = "flex";
            document.getElementById("inspector-text-section").style.display = "none";
            document.getElementById("inspector-shape-section").style.display = "none";
            document.getElementById("inspector-common-section").style.display = "none";

            document.getElementById("element-opacity").disabled = true;
            ['btn-layer-up', 'btn-layer-down', 'btn-layer-front', 'btn-layer-back', 'btn-delete', 'btn-group', 'btn-ungroup'].forEach(id => document.getElementById(id).disabled = true);
        }

        function onObjectModified(e) {
            const activeObj = e.target;
            if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
                activeObj.originalVwSize = `${((activeObj.fontSize * (activeObj.scaleX || 1) / canvas.getWidth()) * 100).toFixed(2)}vw`;
            }
        }

        function cancelEditing() { if (activeSlideId) loadSlideToCanvas(activeSlideId); }

        // 제목, 부제목, 본문 텍스트 템플릿 삽입
        function addTextTpl(type) {
            if (!activeSlideId) return;
            let text = "텍스트를 입력해 주세요.";
            let fontSizeVw = 3.0;
            let fontWeight = "normal";
            if (type === 'title') {
                text = "제목을 입력해 주세요.";
                fontSizeVw = 5.0;
                fontWeight = "bold";
            } else if (type === 'subtitle') {
                text = "부제목을 입력해 주세요.";
                fontSizeVw = 3.5;
                fontWeight = "bold";
            } else if (type === 'body') {
                text = "본문 내용을 입력해 주세요.";
                fontSizeVw = 2.0;
                fontWeight = "normal";
            }
            const pxSize = (fontSizeVw / 100) * canvas.getWidth();
            const obj = new fabric.Textbox(text, {
                left: 100,
                top: 100,
                width: 350,
                fontSize: pxSize,
                fill: '#ffffff',
                fontFamily: 'Inter',
                fontWeight: fontWeight,
                originalId: `elem_${Math.random().toString(36).substr(2, 9)}`,
                originalVwSize: `${fontSizeVw}vw`
            });
            canvas.add(obj);
            canvas.setActiveObject(obj);
            canvas.renderAll();
        }

        function addRect() {
            if (!activeSlideId) return;
            const obj = new fabric.Rect({ left: 150, top: 150, width: 150, height: 100, fill: '#6366f1', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        // 원형 도형 기본 Fill 색상을 인디고 테마에 어울리는 청록색(Cyan)으로 지정
        function addCircle() {
            if (!activeSlideId) return;
            const obj = new fabric.Circle({ left: 150, top: 150, radius: 60, fill: '#06b6d4', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addTriangle() {
            if (!activeSlideId) return;
            const obj = new fabric.Triangle({ left: 150, top: 150, width: 120, height: 100, fill: '#10b981', originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function addLine() {
            if (!activeSlideId) return;
            const obj = new fabric.Line([50, 50, 200, 50], { left: 150, top: 150, stroke: '#f59e0b', strokeWidth: 4, originalId: `elem_${Math.random().toString(36).substr(2, 9)}` });
            canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll();
        }

        function layerUp() { if (currentEditingElement) { canvas.bringForward(currentEditingElement); canvas.renderAll(); } }
        function layerDown() { if (currentEditingElement) { canvas.sendBackwards(currentEditingElement); canvas.renderAll(); } }
        function layerFront() { if (currentEditingElement) { canvas.bringToFront(currentEditingElement); canvas.renderAll(); } }
        function layerBack() { if (currentEditingElement) { canvas.sendToBack(currentEditingElement); canvas.renderAll(); } }

        function groupObjects() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'activeSelection') {
                const group = activeObj.toGroup();
                group.originalId = `elem_${Math.random().toString(36).substr(2, 9)}`;
                canvas.requestRenderAll();
                onObjectSelected({ target: group });
            }
        }

        function ungroupObjects() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'group') {
                activeObj.toActiveSelection();
                canvas.requestRenderAll();
                onObjectSelected({ target: canvas.getActiveObject() });
            }
        }

        // 템플릿 적용 완료 및 템플릿 삭제 이벤트를 websocket 메시지 수신 이후 로컬 프로젝트 정보 갱신을 위해 handle sync 등 추가적으로 처리
        function deleteElement() {
            if (currentEditingElement) { canvas.remove(currentEditingElement); canvas.discardActiveObject(); onObjectCleared(); canvas.renderAll(); }
        }

        function saveSlideData() {
            if (!activeSlideId || !projectData) return;
            const slide = projectData.slides.find(s => s.id === activeSlideId);
            
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvas.discardActiveObject();
                canvas.requestRenderAll();
            }
            
            const thumbnailData = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.4
            });
            
            if (activeObj) {
                canvas.setActiveObject(activeObj);
                canvas.requestRenderAll();
            }

            const elements = canvas.getObjects().map(obj => serializeElement(obj, canvas.getWidth(), canvas.getHeight()));
            const updatedSlide = { id: slide.id, name: slide.name, thumbnail: thumbnailData, elements: elements };
            ws.send(JSON.stringify({ type: "SAVE_SLIDE", slide: updatedSlide }));
            const idx = projectData.slides.findIndex(s => s.id === activeSlideId);
            if (idx !== -1) projectData.slides[idx] = updatedSlide;
            alert("슬라이드가 저장 및 동기화되었습니다.");
            renderSlides();
        }

        function addSlide() {
            ws.send(JSON.stringify({ type: "ADD_SLIDE" }));
        }

        function saveAsTemplate() {
            if (!activeSlideId || !canvas) return;
            const tplName = prompt("저장할 템플릿의 이름을 입력하세요:", "새 디자인 템플릿");
            if (!tplName) return;

            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvas.discardActiveObject();
                canvas.requestRenderAll();
            }
            
            const thumbnailData = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.4
            });
            
            if (activeObj) {
                canvas.setActiveObject(activeObj);
                canvas.requestRenderAll();
            }

            const elements = canvas.getObjects().map(obj => serializeElement(obj, canvas.getWidth(), canvas.getHeight()));
            const templateData = {
                id: `tpl_${Math.random().toString(36).substr(2, 9)}`,
                name: tplName,
                thumbnail: thumbnailData,
                elements: elements
            };

            ws.send(JSON.stringify({
                type: "SAVE_TEMPLATE",
                template: templateData
            }));
        }

        function deleteTemplate() {
            const selectEl = document.getElementById("select-templates");
            const tplId = selectEl.value;
            if (!tplId) {
                alert("삭제할 템플릿을 먼저 선택해주세요.");
                return;
            }
            if (confirm("정말로 이 템플릿을 삭제하시겠습니까?")) {
                ws.send(JSON.stringify({
                    type: "DELETE_TEMPLATE",
                    templateId: tplId
                }));
            }
        }

        function applyTemplateBulk() {
            const selectEl = document.getElementById("select-templates");
            const tplId = selectEl.value;
            if (!tplId) {
                alert("적용할 템플릿을 선택해주세요.");
                return;
            }

            const checkboxes = document.querySelectorAll(".slide-select-checkbox:checked");
            const slideIds = Array.from(checkboxes).map(cb => cb.getAttribute("data-slide-id"));
            if (slideIds.length === 0) {
                alert("템플릿을 일괄 적용할 슬라이드를 왼쪽 목록에서 체크박스로 선택해주세요.");
                return;
            }

            if (confirm(`선택한 ${slideIds.length}개의 슬라이드에 디자인 템플릿을 일괄 적용하시겠습니까? (기존 요소들은 모두 교체됩니다.)`)) {
                ws.send(JSON.stringify({
                    type: "APPLY_TEMPLATE_BULK",
                    slideIds: slideIds,
                    templateId: tplId
                }));
            }
        }

        function renderTemplates() {
            const selectEl = document.getElementById("select-templates");
            if (!selectEl) return;
            selectEl.innerHTML = '<option value="">-- 템플릿 선택 --</option>';
            if (!projectData || !projectData.templates) return;
            projectData.templates.forEach(tpl => {
                const opt = document.createElement("option");
                opt.value = tpl.id;
                opt.innerText = tpl.name;
                selectEl.appendChild(opt);
            });
        }

        function connectWebSocket() {
            ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws?role=editor`);
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'INITIAL_SYNC') { 
                    projectData = message.data; 
                    renderSlides(); 
                    renderTemplates();

                    // 썸네일이 없는 슬라이드가 있다면 순차적으로 자동 생성하여 반영 및 서버 동기화
                    let needsUpdate = false;
                    const promises = projectData.slides.map(slide => {
                        if (!slide.thumbnail) {
                            needsUpdate = true;
                            return autoGenerateThumbnail(slide);
                        }
                        return Promise.resolve();
                    });
                    
                    if (needsUpdate) {
                        Promise.all(promises).then(() => {
                            renderSlides();
                        });
                    }
                }
                else if (message.type === 'SLIDE_LOCKED') {
                    lockedSlides[message.slideId] = { ownerId: message.ownerId, editorName: message.editorName };
                    if (message.slideId === activeSlideId) {
                        myEditorId = message.ownerId;
                        document.getElementById("lock-banner").style.display = "flex";
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UNLOCKED') {
                    delete lockedSlides[message.slideId];
                    if (message.slideId === activeSlideId) {
                        document.getElementById("lock-banner").style.display = "none";
                    }
                    renderSlides();
                }
                else if (message.type === 'SLIDE_UPDATED') {
                    const idx = projectData.slides.findIndex(s => s.id === message.slideId);
                    if (idx !== -1) projectData.slides[idx] = message.slide;
                    if (activeSlideId === message.slideId && lockedSlides[activeSlideId]?.ownerId !== myEditorId) {
                        loadSlideToCanvas(activeSlideId);
                    }
                    renderSlides();
                }
                else if (message.type === 'PROJECT_SYNC') {
                    projectData = message.data;
                    renderSlides();
                    renderTemplates();
                    if (activeSlideId) {
                        loadSlideToCanvas(activeSlideId);
                    }
                }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        window.onload = () => {
            initCanvas();
            connectWebSocket();

            // 슬라이드 추가 버튼
            document.getElementById("btn-add-slide").onclick = addSlide;

            // 템플릿 제어 버튼
            document.getElementById("btn-save-template").onclick = saveAsTemplate;
            document.getElementById("btn-apply-template-bulk").onclick = applyTemplateBulk;
            document.getElementById("btn-delete-template").onclick = deleteTemplate;

            // 공통: 불투명도 조절 슬라이더
            document.getElementById("element-opacity").oninput = (e) => {
                if (currentEditingElement) {
                    const val = parseFloat(e.target.value);
                    currentEditingElement.set('opacity', val);
                    document.getElementById("opacity-val").innerText = `${Math.round(val * 100)}%`;
                    canvas.renderAll();
                }
            };

            // 텍스트 서식 리스너들
            document.getElementById("text-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('text', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("fontfamily-editor").onchange = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('fontFamily', e.target.value);
                    canvas.renderAll();
                }
            };

            document.getElementById("fontsize-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const vw = parseFloat(e.target.value) || 3.0;
                    const pxSize = (vw / 100) * canvas.getWidth();
                    
                    currentEditingElement.set('fontSize', pxSize);
                    currentEditingElement.originalVwSize = `${vw}vw`;
                    canvas.renderAll();
                }
            };

            document.getElementById("fontcolor-editor").oninput = (e) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const val = e.target.value;
                    currentEditingElement.set('fill', val);
                    document.getElementById("fontcolor-hex").innerText = val.toUpperCase();
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-bold").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isBold = currentEditingElement.fontWeight === 'bold';
                    currentEditingElement.set('fontWeight', isBold ? 'normal' : 'bold');
                    document.getElementById("btn-bold").classList.toggle("active", !isBold);
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-italic").onclick = () => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    const isItalic = currentEditingElement.fontStyle === 'italic';
                    currentEditingElement.set('fontStyle', isItalic ? 'normal' : 'italic');
                    document.getElementById("btn-italic").classList.toggle("active", !isItalic);
                    canvas.renderAll();
                }
            };

            const setAlign = (align) => {
                if (currentEditingElement && (currentEditingElement.type === 'textbox' || currentEditingElement.type === 'text')) {
                    currentEditingElement.set('textAlign', align);
                    document.getElementById("btn-align-left").classList.toggle("active", align === 'left');
                    document.getElementById("btn-align-center").classList.toggle("active", align === 'center');
                    document.getElementById("btn-align-right").classList.toggle("active", align === 'right');
                    canvas.renderAll();
                }
            };

            document.getElementById("btn-align-left").onclick = () => setAlign('left');
            document.getElementById("btn-align-center").onclick = () => setAlign('center');
            document.getElementById("btn-align-right").onclick = () => setAlign('right');

            // 도형 서식 리스너들
            document.getElementById("shape-fillcolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    const val = e.target.value;
                    currentEditingElement.set('fill', val);
                    document.getElementById("shape-fillcolor-hex").innerText = val.toUpperCase();
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokecolor").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    const val = e.target.value;
                    currentEditingElement.set('stroke', val);
                    document.getElementById("shape-strokecolor-hex").innerText = val.toUpperCase();
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-strokewidth").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type !== 'textbox' && currentEditingElement.type !== 'text') {
                    currentEditingElement.set('strokeWidth', parseInt(e.target.value) || 0);
                    canvas.renderAll();
                }
            };

            document.getElementById("shape-corners").oninput = (e) => {
                if (currentEditingElement && currentEditingElement.type === 'rect') {
                    const val = parseInt(e.target.value) || 0;
                    currentEditingElement.set({ rx: val, ry: val });
                    canvas.renderAll();
                }
            };

            // 도형 추가 리스너
            document.getElementById("btn-add-rect").onclick = addRect;
            document.getElementById("btn-add-circle").onclick = addCircle;
            document.getElementById("btn-add-triangle").onclick = addTriangle;
            document.getElementById("btn-add-line").onclick = addLine;

            // 레이어 리스너
            document.getElementById("btn-layer-up").onclick = layerUp;
            document.getElementById("btn-layer-down").onclick = layerDown;
            document.getElementById("btn-layer-front").onclick = layerFront;
            document.getElementById("btn-layer-back").onclick = layerBack;

            // 그룹화 / 그룹 해제 리스너
            document.getElementById("btn-group").onclick = groupObjects;
            document.getElementById("btn-ungroup").onclick = ungroupObjects;

            // 삭제 리스너
            document.getElementById("btn-delete").onclick = deleteElement;

            // Delete 키 단축키로 삭제 처리
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' && currentEditingElement) {
                    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA') {
                        return;
                    }
                    deleteElement();
                }
            });

            // 저장/취소 리스너
            document.getElementById("btn-save").onclick = saveSlideData;
            document.getElementById("btn-cancel").onclick = cancelEditing;

            // 창 닫을 때 락 자동 반환
            window.onbeforeunload = () => {
                releaseActiveLock();
            };
        };
    </script>
</body>
</html>
