<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Subcast - 실시간 편집기 (Editor)</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Fabric.js 안정 버전 5.3.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --panel-bg: #1f2937;
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(20px);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent-live: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dark: #111827;
            --green-online: #10b981;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(239, 68, 68, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. Top Bar (상단 바) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            padding: 0 24px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: var(--panel-blur);
            border-bottom: 1px solid var(--panel-border);
            z-index: 100;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-fill-color: transparent;
            -webkit-text-fill-color: transparent;
        }
        
        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-center h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--panel-border);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .editor-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .editor-name-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .editor-name-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: white;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            width: 110px;
        }
        
        .editor-name-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-live);
        }
        
        .status-badge.connected .status-dot {
            background-color: var(--green-online);
            box-shadow: 0 0 6px var(--green-online);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
            transform: translateY(-5px);
        }
        
        .header-actions.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .btn-header-action {
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .btn-header-action.btn-save {
            background: var(--primary);
            color: white;
        }
        .btn-header-action.btn-save:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px var(--primary-glow);
            transform: translateY(-1px);
        }
        .btn-header-action.btn-save:disabled,
        .btn-header-action.btn-cancel:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .btn-header-action.btn-cancel {
            background: transparent;
            border-color: var(--panel-border);
            color: var(--text-main);
        }
        .btn-header-action.btn-cancel:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        /* 2. Main Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            height: calc(100vh - 56px);
            position: relative;
        }

        .left-sub-panel.collapsed {
            width: 0 !important;
            border-right: none !important;
        }
        .left-sub-panel.collapsed .sidebar-panel {
            display: none !important;
        }
        .left-sub-panel.collapsed + #left-panel-resizer {
            display: none !important;
        }

        /* 상단 드로어 토글 버튼 (화살표 모양) */
        .sidebar-top-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            border-radius: var(--radius-sm);
        }
        .sidebar-top-toggle:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Left Navigation Sidebar (아이콘 세로 탭) */
        .left-nav-sidebar {
            width: 72px;
            background: #0f131f;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 12px;
            flex-shrink: 0;
        }

        .nav-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .nav-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }
        
        .nav-tab-btn.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .nav-tab-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: transform 0.2s ease;
        }
        .nav-tab-btn:hover svg {
            transform: scale(1.05);
        }
        .nav-tab-btn.active svg {
            stroke: white;
        }

        /* Left Sub Panel (드로어 패널) */
        .left-sub-panel {
            width: 280px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: var(--panel-blur);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: visible; /* 에지 플로팅 버튼 노출용 */
            flex-shrink: 0;
            position: relative;
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #left-panel-resizer:hover, #left-panel-resizer.resizing {
            background: rgba(99, 102, 241, 0.3) !important;
        }

        .sidebar-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        
        .sidebar-panel.active {
            display: flex;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 슬라이드 목록 스타일 */
        .slide-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slide-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: var(--shadow-sm);
        }
        
        .slide-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        
        .slide-item.editing {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
        }
        
        .slide-item.locked {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .slide-item.editing::before, .slide-item.locked::before {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 5;
        }
        
        .slide-item.editing::before {
            content: 'EDITING';
            background: var(--primary);
            color: white;
        }
        
        .slide-item.locked::before {
            content: 'LOCKED';
            background: var(--accent-live);
            color: white;
        }

        .slide-item-checkbox {
            accent-color: var(--primary);
        }

        .slide-thumbnail-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #090d16;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }
        
        .slide-thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lock-owner-text {
            font-size: 0.7rem;
            color: #f87171;
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 템플릿 패널 스타일 */
        .template-actions {
            margin-bottom: 16px;
        }
        
        .btn-template-action {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            color: white;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-template-action:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-template-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .template-selector-group {
            margin-top: 20px;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .template-selector-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .select-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
            transition: all 0.2s;
        }
        
        .select-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }
        
        .template-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        
        .template-buttons .btn-apply {
            flex: 1;
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .template-buttons .btn-apply:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.25);
        }
        
        .template-buttons .btn-delete-tpl {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px 14px;
        }
        .template-buttons .btn-delete-tpl:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.2);
        }

        /* 텍스트 삽입 패널 스타일 */
        .text-templates-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn-add-text-tpl {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .btn-add-text-tpl:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: scale(1.01);
        }
        .btn-add-text-tpl:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-add-text-tpl.tpl-title {
            padding: 18px 16px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }
        .btn-add-text-tpl.tpl-subtitle {
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .btn-add-text-tpl.tpl-body {
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 도형/선 삽입 패널 스타일 */
        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .btn-shape-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: white;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .btn-shape-item:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .btn-shape-item:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .shape-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        /* 3. Center Canvas Workspace (중앙 캔버스 영역) */
        .canvas-workspace {
            flex: 1;
            background-color: #0f131f;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .lock-warning-banner {
            background: rgba(239, 68, 68, 0.15);
            border-bottom: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 10px 20px;
            font-size: 0.82rem;
            font-weight: 600;
            width: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .canvas-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
            position: relative;
        }

        .canvas-wrapper-outer {
            background: #090d16;
            padding: 6px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s;
        }
        
        .canvas-wrapper-outer:focus-within {
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }

        .canvas-wrapper-outer.dragover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6) !important;
            border-color: var(--primary) !important;
        }

        .canvas-wrapper {
            width: 768px;
            height: 432px;
            background: #111827;
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        /* 캔버스 하단 바 */
        .canvas-bottom-bar {
            height: 38px;
            background: rgba(17, 24, 39, 0.9);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* 4. Right Inspector Panel (우측 속성 패널) */
        .right-inspector-panel {
            width: 300px;
            background: rgba(17, 24, 39, 0.93);
            backdrop-filter: var(--panel-blur);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;

            /* Floating Absolute Positioning & Draggable */
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            height: auto;
            max-height: 80%;
        }

        .right-inspector-panel .panel-header {
            border-bottom: 1px solid var(--panel-border);
            padding: 16px 20px;
            cursor: grab;
            user-select: none;
        }
        .right-inspector-panel .panel-header:active {
            cursor: grabbing;
        }

        .inspector-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inspector-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 16px;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .inspector-empty p {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .inspector-section {
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 20px;
        }
        
        .inspector-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .property-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .property-row:last-child {
            margin-bottom: 0;
        }

        .property-row.inline {
            flex-direction: row;
            gap: 12px;
        }
        
        .property-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .property-row label, .property-col label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .text-area-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: white;
            font-size: 0.8rem;
            resize: none;
            height: 60px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .text-area-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .fontSize-input {
