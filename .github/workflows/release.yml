name: Subcast Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from version.txt
        id: version
        shell: pwsh
        run: |
          $ver = Get-Content version.txt -Encoding UTF8 | Select-Object -First 1
          $ver = $ver.Trim()
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_NAME -ne "v$ver") { throw "Release tag $env:GITHUB_REF_NAME does not match version.txt v$ver" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests (excluding known hanging WS test)
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          pytest tests/ --ignore=tests/test_template_undo.py -q

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify browser scenarios before packaging
        env:
          SUBCAST_TEST_PYTHON: python
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed' }
          npm run test:browser:setup
          if ($LASTEXITCODE -ne 0) { throw 'Browser test asset preparation failed' }
          npx playwright install msedge
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { throw 'Browser regression scenarios failed' }

      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-regression
          path: test_results/browser/
          retention-days: 7

      - name: Build with PyInstaller
        env:
          SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON }}
        shell: pwsh
        run: |
          if (-not $env:SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON) { throw 'Repository secret SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON is required to package Google Drive OAuth.' }
          $oauthCredentialName = 'client_secret_131602755526-k80ot6sq10ttqhos02vho3vuemj7khia.apps.googleusercontent.com.json'
          $oauthCredentialPath = Join-Path $PWD $oauthCredentialName
          try {
            $oauthConfig = $env:SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON | ConvertFrom-Json
            if ($oauthConfig.installed.client_id -cne '131602755526-k80ot6sq10ttqhos02vho3vuemj7khia.apps.googleusercontent.com' -or [string]::IsNullOrWhiteSpace($oauthConfig.installed.client_secret)) {
              throw 'Repository OAuth credentials must contain the configured installed-app client ID and a client secret.'
            }
            [System.IO.File]::WriteAllText($oauthCredentialPath, $env:SUBCAST_GOOGLE_OAUTH_CREDENTIALS_JSON, [System.Text.UTF8Encoding]::new($false))
            pyinstaller subcast.spec --clean -y
            if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed to build the release package.' }
            $packagedCredential = Get-ChildItem -Path 'dist\subcast' -Filter $oauthCredentialName -File -Recurse | Select-Object -First 1
            if (-not $packagedCredential) { throw 'The release package does not contain the OAuth credentials file.' }
            $packagedOAuthConfig = Get-Content -Raw $packagedCredential.FullName | ConvertFrom-Json
            if ($packagedOAuthConfig.installed.client_id -cne '131602755526-k80ot6sq10ttqhos02vho3vuemj7khia.apps.googleusercontent.com' -or [string]::IsNullOrWhiteSpace($packagedOAuthConfig.installed.client_secret)) {
              throw 'The packaged OAuth credentials do not match the configured installed-app client.'
            }
          } finally {
            Remove-Item -LiteralPath $oauthCredentialPath -Force -ErrorAction SilentlyContinue
          }

      - name: Copy version.txt to dist if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\subcast\version.txt")) {
            Copy-Item version.txt "dist\subcast\version.txt"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          # ISCC 경로를 환경 PATH에 추가
          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          echo "$isccDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$ver setup.iss

      - name: Verify upgrades from v1.3.22 and v1.3.23 preserve user data
        shell: pwsh
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $newInstaller = (Resolve-Path "dist\Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe").Path
          & .\tests\release_upgrade_smoke.ps1 -NewInstaller $newInstaller -Root (Join-Path $env:RUNNER_TEMP 'subcast-upgrade-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'One or more previous-release upgrade scenarios failed' }

      - name: Create installer checksum
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $installer = "dist\Subcast_Setup_v$ver.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "${installer}.sha256" -Value $hash -NoNewline -Encoding ascii

      - name: Create ZIP package
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $zipName = "subcast-v$ver-windows.zip"
          Compress-Archive -Path "dist\subcast\*" -DestinationPath "dist\$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Subcast v${{ steps.version.outputs.VERSION }}
          body: |
            ## Subcast v${{ steps.version.outputs.VERSION }}

            ### 주요 변경 사항
            - 환경 설정과 배경 영상을 Google Drive에 동기화하고, 변경된 영상만 전송해 불필요한 업로드·다운로드를 줄였습니다.
            - 동기화 진행 상태를 모달 밖에서도 확인할 수 있도록 개선하고, 오래 걸리는 작업은 백그라운드에서 이어집니다.
            - 환경 설정을 복원한 뒤 프로젝트를 가져오면 기존 배경 영상과 자동으로 다시 연결합니다.
            - 프로그램에서 배경 영상 이름을 바꾸면 프로젝트가 참조하는 영상 이름도 함께 갱신됩니다.

            ### 사용자 데이터 보존 검증
            - v1.3.22 및 v1.3.23 설치본에서 새 버전으로 실제 설치 업그레이드를 수행합니다.
            - 프로젝트와 슬라이드 내용, 사용자 템플릿, 사용자 글꼴, 찬양곡 데이터베이스, 무대 모니터 설정, 배경 영상, 앱 설정 파일을 업그레이드 전후로 확인합니다.
            - 설치 파일의 SHA-256을 확인하고, 업그레이드 후 앱 자동 실행 및 프로젝트 API 응답까지 점검합니다.
            - Python 회귀 테스트와 전체 브라우저 시나리오를 통과한 뒤에만 릴리즈 파일을 게시합니다.

            ### 설치 방법
            - **설치 버전**: `Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe` 다운로드 후 실행
            - **포터블 버전**: `subcast-v${{ steps.version.outputs.VERSION }}-windows.zip` 압축 해제 후 `subcast.exe` 실행

            ### 자동 업데이트
            앱 내 **업데이트 확인**을 사용하면 자동으로 최신 버전으로 업데이트됩니다. 프로젝트, 공통 설정, 찬양곡 데이터, 배경 영상은 유지됩니다.
          draft: false
          prerelease: false
          files: |
            dist/Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe
            dist/Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe.sha256
            dist/${{ steps.zip.outputs.ZIP_NAME }}
