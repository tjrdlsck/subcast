name: Subcast Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from version.txt
        id: version
        shell: pwsh
        run: |
          $ver = Get-Content version.txt -Encoding UTF8 | Select-Object -First 1
          $ver = $ver.Trim()
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests (excluding known hanging WS test)
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          pytest tests/ --ignore=tests/test_template_undo.py -q

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller subcast.spec --clean -y

      - name: Copy version.txt to dist if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\subcast\version.txt")) {
            Copy-Item version.txt "dist\subcast\version.txt"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          $out = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Start-Process -FilePath $out -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$ver setup.iss

      - name: Create ZIP package
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $zipName = "subcast-v$ver-windows.zip"
          Compress-Archive -Path "dist\subcast\*" -DestinationPath "dist\$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Subcast v${{ steps.version.outputs.VERSION }}
          body: |
            ## Subcast v${{ steps.version.outputs.VERSION }} 릴리즈

            ### 설치 방법
            - **설치 버전**: `Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe` 다운로드 후 실행
            - **포터블 버전**: `subcast-v${{ steps.version.outputs.VERSION }}-windows.zip` 압축 해제 후 `subcast.exe` 실행

            ### 자동 업데이트
            앱 내 **업데이트 확인** 버튼을 누르면 자동으로 최신 버전으로 업데이트됩니다.
            기존 데이터(프로젝트, 설정)는 유지됩니다.
          draft: false
          prerelease: false
          files: |
            dist/Subcast_Setup_v${{ steps.version.outputs.VERSION }}.exe
            dist/${{ steps.zip.outputs.ZIP_NAME }}
